<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Soccer Pong</title>

<style>
body {
  margin: 0;
  background: #f5f5f5;
  font-family: 'Comic Sans MS', cursive, sans-serif;
  text-align: center;
}

header {
  background: #4CAF50;
  color: white;
  padding: 20px;
  font-size: 28px;
}

footer {
  background: #4CAF50;
  color: white;
  padding: 15px;
  margin-top: 40px;
}

.game-container {
  background: #FFEB3B;
  margin: 40px auto;
  padding: 30px;
  border-radius: 20px;
  box-shadow: 0 5px 15px rgba(0,0,0,0.2);
  max-width: 750px;
}

canvas {
  background: #2E7D32;
  border-radius: 12px;
  display: block;
  margin: 20px auto;
}

.score-board {
  font-size: 22px;
  font-weight: bold;
}

button {
  margin-top: 15px;
  padding: 10px 20px;
  background: #4CAF50;
  color: white;
  border: none;
  border-radius: 12px;
  cursor: pointer;
  font-size: 16px;
}

button:hover {
  background: #43a047;
}
</style>
</head>

<body>

<header>⚽ Soccer Pong (2 Player)</header>

<div class="game-container">

  <div class="score-board">
    Player 1: <span id="p1Score">0</span> |
    Player 2: <span id="p2Score">0</span>
  </div>

  <canvas id="game" width="700" height="400"></canvas>

  <button onclick="startGame()">Start Game</button>

  <p>Player 1: W / S &nbsp;&nbsp; | &nbsp;&nbsp; Player 2: ↑ / ↓</p>

</div>

<footer>© 2026 Multi</footer>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let paddleHeight = 100;
let paddleWidth = 12;

let p1Y = 150;
let p2Y = 150;

let ballX = canvas.width / 2;
let ballY = canvas.height / 2;
let ballSpeedX = 5;
let ballSpeedY = 4;

let p1Score = 0;
let p2Score = 0;

let keys = {};
let gameInterval;

function startGame() {
  clearInterval(gameInterval);
  p1Score = 0;
  p2Score = 0;
  document.getElementById("p1Score").innerText = 0;
  document.getElementById("p2Score").innerText = 0;
  resetBall();
  gameInterval = setInterval(gameLoop, 1000/60);
}

function resetBall() {
  ballX = canvas.width / 2;
  ballY = canvas.height / 2;
  ballSpeedX = (Math.random() > 0.5 ? 5 : -5);
  ballSpeedY = 4 * (Math.random() > 0.5 ? 1 : -1);
}

function gameLoop() {
  update();
  draw();
}

function update() {

  // Player 1 (W / S)
  if (keys["w"]) p1Y -= 6;
  if (keys["s"]) p1Y += 6;

  // Player 2 (Arrow keys)
  if (keys["ArrowUp"]) p2Y -= 6;
  if (keys["ArrowDown"]) p2Y += 6;

  // Keep paddles inside field
  if (p1Y < 0) p1Y = 0;
  if (p1Y + paddleHeight > canvas.height)
    p1Y = canvas.height - paddleHeight;

  if (p2Y < 0) p2Y = 0;
  if (p2Y + paddleHeight > canvas.height)
    p2Y = canvas.height - paddleHeight;

  // Move ball
  ballX += ballSpeedX;
  ballY += ballSpeedY;

  // Top & bottom wall
  if (ballY <= 0 || ballY >= canvas.height)
    ballSpeedY = -ballSpeedY;

  // Paddle collision
  if (
    ballX <= 30 &&
    ballY > p1Y &&
    ballY < p1Y + paddleHeight
  ) {
    ballSpeedX = -ballSpeedX;
  }

  if (
    ballX >= canvas.width - 30 &&
    ballY > p2Y &&
    ballY < p2Y + paddleHeight
  ) {
    ballSpeedX = -ballSpeedX;
  }

  // Score
  if (ballX < 0) {
    p2Score++;
    document.getElementById("p2Score").innerText = p2Score;
    checkWinner();
    resetBall();
  }

  if (ballX > canvas.width) {
    p1Score++;
    document.getElementById("p1Score").innerText = p1Score;
    checkWinner();
    resetBall();
  }
}

function checkWinner() {
  if (p1Score === 5) {
    alert("Player 1 Wins! ⚽");
    startGame();
  }
  if (p2Score === 5) {
    alert("Player 2 Wins! ⚽");
    startGame();
  }
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Field lines
  ctx.strokeStyle = "white";
  ctx.lineWidth = 4;

  // Center line
  ctx.beginPath();
  ctx.moveTo(canvas.width/2, 0);
  ctx.lineTo(canvas.width/2, canvas.height);
  ctx.stroke();

  // Center circle
  ctx.beginPath();
  ctx.arc(canvas.width/2, canvas.height/2, 60, 0, Math.PI * 2);
  ctx.stroke();

  // Goals
  ctx.strokeRect(0, canvas.height/2 - 60, 10, 120);
  ctx.strokeRect(canvas.width - 10, canvas.height/2 - 60, 10, 120);

  // Paddles
  ctx.fillStyle = "white";
  ctx.fillRect(20, p1Y, paddleWidth, paddleHeight);
  ctx.fillRect(canvas.width - 32, p2Y, paddleWidth, paddleHeight);

  // Ball (soccer style)
  ctx.beginPath();
  ctx.fillStyle = "white";
  ctx.arc(ballX, ballY, 10, 0, Math.PI * 2);
  ctx.fill();
}

// Key controls
window.addEventListener("keydown", e => keys[e.key] = true);
window.addEventListener("keyup", e => keys[e.key] = false);

</script>

</body>
</html>

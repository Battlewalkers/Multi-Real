<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Multi Competitive Soccer</title>
<style>
body{
  margin:0;
  overflow:hidden;
  font-family:Comic Sans MS,cursive;
  background:#1b5e20;
  color:white;
}
canvas{ display:block; }
.menu{
  position:absolute;
  width:100%;
  text-align:center;
  top:20%;
}
button{
  padding:12px 25px;
  margin:8px;
  font-size:18px;
  border:none;
  border-radius:10px;
  background:#FFEB3B;
  cursor:pointer;
}
button:hover{ background:#fdd835; }
</style>
</head>
<body>

<div id="mainMenu" class="menu">
  <h1>⚽ Multi Competitive</h1>
  <button onclick="startTeamSelect()">Play</button>
</div>

<div id="teamMenu" class="menu" style="display:none;">
<h2 id="teamTitle">Player 1 - Pick Team</h2>
<button onclick="pickTeam('blue')">Blue</button>
<button onclick="pickTeam('red')">Red</button>
<button onclick="pickTeam('purple')">Purple</button>
<button onclick="pickTeam('orange')">Orange</button>
</div>

<div id="pauseMenu" class="menu" style="display:none;">
<h2>Paused</h2>
<button onclick="resumeGame()">Resume</button>
<button onclick="backToMenu()">Back to Menu</button>
</div>

<canvas id="game"></canvas>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");
canvas.width=window.innerWidth;
canvas.height=window.innerHeight;

let keys={};
window.addEventListener("keydown",e=>{
keys[e.key]=true;
if(e.key==="Escape") togglePause();
});
window.addEventListener("keyup",e=>keys[e.key]=false);

let players=[],ball;
let selectingPlayer=1;
let p1Team=null,p2Team=null;
let matchTime=180;
let overtime=false;
let gameRunning=false;
let paused=false;

/* ---------------- TEAM SELECT ---------------- */

function startTeamSelect(){
document.getElementById("mainMenu").style.display="none";
document.getElementById("teamMenu").style.display="block";
}

function pickTeam(team){
if(selectingPlayer===1){
p1Team=team;
selectingPlayer=2;
document.getElementById("teamTitle").innerText="Player 2 - Pick Team";
return;
}
if(team===p1Team){
alert("Team already chosen!");
return;
}
p2Team=team;
document.getElementById("teamMenu").style.display="none";
startGame();
}

/* ---------------- GAME INIT ---------------- */

function startGame(){
init();
gameRunning=true;
paused=false;
loop();
}

function init(){
players=[
{
x:150,y:canvas.height/2,color:p1Team,
left:"ArrowLeft",right:"ArrowRight",up:"ArrowUp",down:"ArrowDown",
dash:"Shift",shoot:".",
stamina:100,holding:false,charge:0,score:0,dashCD:0,shootLock:false
},
{
x:canvas.width-150,y:canvas.height/2,color:p2Team,
left:"a",right:"d",up:"w",down:"s",
dash:"f",shoot:"g",
stamina:100,holding:false,charge:0,score:0,dashCD:0,shootLock:false
}
];

ball={x:canvas.width/2,y:canvas.height/2,vx:0,vy:0,holder:null,noPickup:0};
matchTime=180;
overtime=false;
}

/* ---------------- LOOP ---------------- */

let lastTime=Date.now();

function loop(){
if(!gameRunning) return;

if(paused){
draw();
requestAnimationFrame(loop);
return;
}

let now=Date.now();
let delta=(now-lastTime)/1000;
lastTime=now;

update(delta);
draw();
requestAnimationFrame(loop);
}

/* ---------------- UPDATE ---------------- */

function update(delta){

matchTime-=delta;

if(matchTime<=0){
if(players[0].score===players[1].score && !overtime){
overtime=true;
matchTime=60; // 1 min overtime
alert("OVERTIME!");
}else{
endMatch();
}
}

if(ball.noPickup>0) ball.noPickup--;

players.forEach((p,i)=>{

if(p.stamina<100) p.stamina+=15*delta;
if(p.stamina>100) p.stamina=100;
if(p.dashCD>0) p.dashCD--;

let speed=5;
p.dx=0;p.dy=0;

if(keys[p.left]) p.dx=-speed;
if(keys[p.right]) p.dx=speed;
if(keys[p.up]) p.dy=-speed;
if(keys[p.down]) p.dy=speed;

/* DASH */
if(keys[p.dash] && p.stamina>=25 && p.dashCD===0){
p.dx*=2;
p.dy*=2;
p.stamina-=25;
p.dashCD=120;
}

p.x+=p.dx;
p.y+=p.dy;

p.x=Math.max(25,Math.min(canvas.width-25,p.x));
p.y=Math.max(25,Math.min(canvas.height-25,p.y));
});

/* BALL */
if(ball.holder){
ball.x=ball.holder.x;
ball.y=ball.holder.y;
}else{
ball.x+=ball.vx;
ball.y+=ball.vy;
ball.vx*=0.99;
ball.vy*=0.99;

if(ball.noPickup===0){
players.forEach(p=>{
if(dist(p,ball)<30){
ball.holder=p;
p.holding=true;
}
});
}
}

/* SHOOT (Balanced + stamina scaling) */
players.forEach((p,i)=>{
if(keys[p.shoot] && p.holding){
if(p.charge<50) p.charge++;
}
if(!keys[p.shoot] && p.holding && p.charge>0){

let staminaCost=5 + p.charge*0.6;

if(p.stamina>=staminaCost){

p.stamina-=staminaCost;

let dir=(i===0)?1:-1;
let power=5 + (p.charge*0.2); // MUCH LOWER POWER

ball.vx=dir*power;
ball.vy=0;

ball.holder=null;
p.holding=false;
ball.noPickup=20;
}

p.charge=0;
}
});

/* GOALS */
let goalSize=150;

if(ball.x<0 && Math.abs(ball.y-canvas.height/2)<goalSize){
players[1].score++; reset();
}
if(ball.x>canvas.width && Math.abs(ball.y-canvas.height/2)<goalSize){
players[0].score++; reset();
}
}

/* ---------------- DRAW ---------------- */

function draw(){

for(let i=0;i<canvas.height;i+=50){
ctx.fillStyle=(i/50)%2?"#2e7d32":"#388e3c";
ctx.fillRect(0,i,canvas.width,50);
}

ctx.strokeStyle="white";
ctx.lineWidth=4;
ctx.beginPath();
ctx.moveTo(canvas.width/2,0);
ctx.lineTo(canvas.width/2,canvas.height);
ctx.stroke();

ctx.beginPath();
ctx.arc(canvas.width/2,canvas.height/2,100,0,Math.PI*2);
ctx.stroke();

/* Players */
players.forEach(p=>{
ctx.fillStyle=p.color;
ctx.beginPath();
ctx.arc(p.x,p.y,28,0,Math.PI*2);
ctx.fill();
});

/* Ball */
ctx.fillStyle="white";
ctx.beginPath();
ctx.arc(ball.x,ball.y,12,0,Math.PI*2);
ctx.fill();

/* Score */
ctx.fillStyle="black";
ctx.fillRect(canvas.width/2-170,15,340,60);
ctx.fillStyle="white";
ctx.font="32px Comic Sans MS";
ctx.fillText(players[0].score+" - "+players[1].score,canvas.width/2-60,55);

/* Timer */
let minutes=Math.floor(matchTime/60);
let seconds=Math.floor(matchTime%60);
if(seconds<10) seconds="0"+seconds;
ctx.fillText(minutes+":"+seconds,canvas.width/2-30,95);

/* Stamina */
players.forEach((p,i)=>{
let x=i===0?30:canvas.width-230;
ctx.fillStyle="black";
ctx.fillRect(x,30,200,20);
ctx.fillStyle="lime";
ctx.fillRect(x,30,(p.stamina/100)*200,20);
});
}

/* ---------------- PAUSE ---------------- */

function togglePause(){
if(!gameRunning) return;
paused=!paused;
document.getElementById("pauseMenu").style.display=paused?"block":"none";
}

function resumeGame(){
paused=false;
document.getElementById("pauseMenu").style.display="none";
}

function backToMenu(){
location.reload();
}

/* ---------------- HELPERS ---------------- */

function reset(){
ball.x=canvas.width/2;
ball.y=canvas.height/2;
ball.vx=0;ball.vy=0;
ball.holder=null;
ball.noPickup=20;
players.forEach(p=>{p.holding=false;p.charge=0;});
}

function endMatch(){
gameRunning=false;
alert("Match Over!");
}

function dist(a,b){
return Math.hypot(a.x-b.x,a.y-b.y);
}
</script>
</body>
</html>

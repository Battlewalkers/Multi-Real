<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Soccer Pong 2P Fixed</title>
<style>
body { margin:0; background:#4CAF50; font-family:Comic Sans MS, cursive; display:flex; justify-content:center; align-items:center; height:100vh; }
canvas { background:#3e8e41; border:4px solid #fff; border-radius:10px; }
</style>
</head>
<body>

<canvas id="gameCanvas" width="800" height="500"></canvas>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

const PLAYER_RADIUS = 20;
const BALL_RADIUS = 12;
const MOVE_SPEED = 5;
const DASH_SPEED = 12;
const FRICTION = 0.9;
const GOAL_WIDTH = 100;

let keys = {};

let players = [
  {x:100,y:canvas.height/2,color:'blue',up:'w',down:'s',left:'a',right:'d',shoot:'f',dash:'g',dx:0,dy:0,score:0,holding:false},
  {x:700,y:canvas.height/2,color:'red',up:'ArrowUp',down:'ArrowDown',left:'ArrowLeft',right:'ArrowRight',shoot:'/',dash:'Shift',dx:0,dy:0,score:0,holding:false}
];

let ball = {x:canvas.width/2,y:canvas.height/2,vx:0,vy:0,holder:null};

window.addEventListener('keydown', e=>{ keys[e.key]=true; });
window.addEventListener('keyup', e=>{ keys[e.key]=false; });

function resetPositions(){
  players[0].x=100; players[0].y=canvas.height/2; players[0].holding=false;
  players[1].x=700; players[1].y=canvas.height/2; players[1].holding=false;
  ball.x=canvas.width/2; ball.y=canvas.height/2; ball.vx=0; ball.vy=0; ball.holder=null;
}

function gameLoop(){
  update();
  draw();
  requestAnimationFrame(gameLoop);
}

function update(){
  // Player movement and dash
  players.forEach((p,i)=>{
    p.dx=0; p.dy=0;
    if(keys[p.left]) p.dx=-MOVE_SPEED;
    if(keys[p.right]) p.dx=MOVE_SPEED;
    if(keys[p.up]) p.dy=-MOVE_SPEED;
    if(keys[p.down]) p.dy=MOVE_SPEED;

    let dashing = keys[p.dash];
    if(dashing){ p.dx*=DASH_SPEED/MOVE_SPEED; p.dy*=DASH_SPEED/MOVE_SPEED; }

    p.x+=p.dx; p.y+=p.dy;
    p.x=Math.max(PLAYER_RADIUS,Math.min(canvas.width-PLAYER_RADIUS,p.x));
    p.y=Math.max(PLAYER_RADIUS,Math.min(canvas.height-PLAYER_RADIUS,p.y));

    // Dash collision steal
    if(dashing){
      let opponent = players[1-i];
      let dist = Math.hypot(p.x-opponent.x, p.y-opponent.y);
      if(dist < PLAYER_RADIUS*2){
        if(opponent.holding){
          opponent.holding=false;
          ball.holder = p;
          p.holding=true;
        }
      }
    }

    // Shoot
    if(keys[p.shoot] && p.holding){
      let dirX=0, dirY=0;
      if(keys[p.up]) dirY=-1;
      else if(keys[p.down]) dirY=1;
      else dirY=0;
      if(keys[p.left]) dirX=-1;
      else if(keys[p.right]) dirX=1;
      else dirX=(i===0)?1:-1; // default forward

      ball.vx=dirX*10;
      ball.vy=dirY*10;
      ball.holder=null;
      p.holding=false;
    }
  });

  // Ball follow
  if(ball.holder){
    ball.x=ball.holder.x;
    ball.y=ball.holder.y;
  } else {
    ball.x+=ball.vx;
    ball.y+=ball.vy;
    ball.vx*=FRICTION;
    ball.vy*=FRICTION;

    // Pickup ball if touch
    players.forEach(p=>{
      let dist=Math.hypot(ball.x-p.x,ball.y-p.y);
      if(dist<PLAYER_RADIUS+BALL_RADIUS && !ball.holder){
        ball.holder=p;
        p.holding=true;
      }
    });
  }

  // Goal check
  if(ball.x<0 && Math.abs(ball.y-canvas.height/2)<GOAL_WIDTH/2){ players[1].score++; resetPositions(); }
  if(ball.x>canvas.width && Math.abs(ball.y-canvas.height/2)<GOAL_WIDTH/2){ players[0].score++; resetPositions(); }
}

function draw(){
  ctx.fillStyle='#3e8e41'; ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.strokeStyle='#fff'; ctx.lineWidth=3;
  ctx.beginPath(); ctx.moveTo(canvas.width/2,0); ctx.lineTo(canvas.width/2,canvas.height); ctx.stroke();
  ctx.fillStyle='yellow'; ctx.fillRect(0,canvas.height/2-GOAL_WIDTH/2,10,GOAL_WIDTH);
  ctx.fillRect(canvas.width-10,canvas.height/2-GOAL_WIDTH/2,10,GOAL_WIDTH);

  // Players
  players.forEach(p=>{
    ctx.fillStyle=p.color;
    ctx.beginPath();
    ctx.arc(p.x,p.y,PLAYER_RADIUS,0,Math.PI*2);
    ctx.fill();
  });

  // Ball
  ctx.fillStyle='white';
  ctx.beginPath();
  ctx.arc(ball.x,ball.y,BALL_RADIUS,0,Math.PI*2);
  ctx.fill();
}

resetPositions();
gameLoop();
</script>

</body>
</html>

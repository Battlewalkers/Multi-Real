<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Soccer Pong 2P / Tournament</title>
<style>
body { margin:0; font-family:Comic Sans MS,cursive,sans-serif; background:#4CAF50; display:flex; flex-direction:column; align-items:center; }
canvas { background:#3e8e41; border:4px solid #fff; border-radius:10px; display:block; margin-top:20px; }
#menu { text-align:center; margin-top:50px; color:white; }
button { margin:5px; padding:10px 20px; font-size:18px; border:none; border-radius:10px; cursor:pointer; background:#FFEB3B; }
button:hover { background:#fdd835; }
</style>
</head>
<body>

<div id="menu">
  <h1>⚽ Soccer Pong</h1>
  <button onclick="startFriendly()">Friendly Match (2P)</button><br>
  <button onclick="showTournamentMenu()">Tournament Mode</button>
</div>

<div id="tournamentMenu" style="display:none; text-align:center; color:white;">
  <h2>Tournament Difficulty</h2>
  <button onclick="startTournament('easy')">Easy</button>
  <button onclick="startTournament('medium')">Medium</button>
  <button onclick="startTournament('hard')">Hard</button><br>
  <button onclick="backToMenu()">Back</button>
</div>

<canvas id="gameCanvas" width="800" height="500" style="display:none;"></canvas>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

let keys = {};
let gameMode = 'friendly';
let aiDifficulty = 'easy';
let dashCooldownTime = 60; // frames
let dashSpeed = 8; // slower dash
let chargeMax = 40; // max frames for full power shot

let players, ball;
let goalAnimation = 0;
let tournamentStandings = [];

window.addEventListener('keydown', e => keys[e.key] = true);
window.addEventListener('keyup', e => keys[e.key] = false);

function initPlayers(isFriendly){
  players = [
    {x:100,y:canvas.height/2,color:'blue',up:'w',down:'s',left:'a',right:'d',shoot:'f',dash:'g',dx:0,dy:0,score:0,holding:false,dashCD:0,charge:0},
    {x:700,y:canvas.height/2,color:'red',up:'ArrowUp',down:'ArrowDown',left:'ArrowLeft',right:'ArrowRight',shoot:'/',dash:'Shift',dx:0,dy:0,score:0,holding:false,dashCD:0,charge:0,ai:!isFriendly}
  ];
}

function initBall(){
  ball = {x:canvas.width/2,y:canvas.height/2,vx:0,vy:0,holder:null};
}

function resetPositions(){
  players[0].x=100; players[0].y=canvas.height/2; players[0].holding=false; players[0].charge=0; players[0].dashCD=0;
  players[1].x=700; players[1].y=canvas.height/2; players[1].holding=false; players[1].charge=0; players[1].dashCD=0;
  ball.x=canvas.width/2; ball.y=canvas.height/2; ball.vx=0; ball.vy=0; ball.holder=null;
}

function startFriendly(){
  document.getElementById('menu').style.display='none';
  canvas.style.display='block';
  gameMode='friendly';
  initPlayers(true);
  initBall();
  resetPositions();
  gameLoop();
}

function showTournamentMenu(){
  document.getElementById('menu').style.display='none';
  document.getElementById('tournamentMenu').style.display='block';
}

function backToMenu(){
  document.getElementById('tournamentMenu').style.display='none';
  document.getElementById('menu').style.display='block';
}

function startTournament(difficulty){
  document.getElementById('tournamentMenu').style.display='none';
  canvas.style.display='block';
  gameMode='tournament';
  aiDifficulty=difficulty;
  initPlayers(false);
  initBall();
  resetPositions();
  tournamentStandings = [{name:'Player',score:0},{name:'AI',score:0}];
  gameLoop();
}

function gameLoop(){
  update();
  draw();
  requestAnimationFrame(gameLoop);
}

function update(){
  players.forEach((p,i)=>{
    // Dash cooldown
    if(p.dashCD>0) p.dashCD--;

    // AI Control
    if(p.ai && gameMode==='tournament'){
      aiMove(p);
    } else {
      p.dx=0; p.dy=0;
      if(keys[p.left]) p.dx=-5;
      if(keys[p.right]) p.dx=5;
      if(keys[p.up]) p.dy=-5;
      if(keys[p.down]) p.dy=5;
    }

    // Dash
    let isDashing = keys[p.dash] && p.dashCD===0;
    if(isDashing){ p.dx*=dashSpeed/5; p.dy*=dashSpeed/5; p.dashCD=dashCooldownTime; }

    p.x+=p.dx; p.y+=p.dy;
    p.x=Math.max(20, Math.min(canvas.width-20, p.x));
    p.y=Math.max(20, Math.min(canvas.height-20, p.y));

    // Dash steal
    if(isDashing){
      let opp = players[1-i];
      let dist = Math.hypot(p.x-opp.x,p.y-opp.y);
      if(dist<40 && opp.holding){
        opp.holding=false;
        ball.holder=p;
        p.holding=true;
      }
    }

    // Charge shooting
    if(keys[p.shoot] && p.holding){
      if(p.charge<chargeMax) p.charge++;
    } else if(p.holding && p.charge>0){
      // Release shot
      let power = 4 + p.charge/5;
      let dirX=0,dirY=0;
      if(keys[p.up]) dirY=-1;
      else if(keys[p.down]) dirY=1;
      if(keys[p.left]) dirX=-1;
      else if(keys[p.right]) dirX=1;
      if(dirX===0 && dirY===0) dirX=(i===0)?1:-1;
      ball.vx=dirX*power;
      ball.vy=dirY*power;
      ball.holder=null;
      p.holding=false;
      p.charge=0;
    }
  });

  // Ball follow holder
  if(ball.holder){
    ball.x=ball.holder.x; ball.y=ball.holder.y;
  } else {
    ball.x+=ball.vx; ball.y+=ball.vy;
    ball.vx*=0.9; ball.vy*=0.9;

    // Pickup
    players.forEach(p=>{
      if(!ball.holder && Math.hypot(ball.x-p.x,ball.y-p.y)<32){
        ball.holder=p; p.holding=true;
      }
    });
  }

  // Goals
  if(ball.x<0 && Math.abs(ball.y-canvas.height/2)<50){
    players[1].score++;
    if(gameMode==='tournament') tournamentStandings[1].score++;
    goalAnimation=30; resetPositions();
  }
  if(ball.x>canvas.width && Math.abs(ball.y-canvas.height/2)<50){
    players[0].score++;
    if(gameMode==='tournament') tournamentStandings[0].score++;
    goalAnimation=30; resetPositions();
  }
}

function aiMove(p){
  let target = ball.holder ? ball.holder : ball;
  let diffX = target.x - p.x;
  let diffY = target.y - p.y;
  let speed = 3;
  if(aiDifficulty==='medium') speed=4;
  if(aiDifficulty==='hard') speed=5;
  p.dx=Math.sign(diffX)*speed;
  p.dy=Math.sign(diffY)*speed;
}

function draw(){
  ctx.fillStyle='#3e8e41'; ctx.fillRect(0,0,canvas.width,canvas.height);

  // Field lines
  ctx.strokeStyle='white'; ctx.lineWidth=3;
  ctx.beginPath(); ctx.moveTo(canvas.width/2,0); ctx.lineTo(canvas.width/2,canvas.height); ctx.stroke();
  ctx.fillStyle='yellow'; ctx.fillRect(0,canvas.height/2-50,10,100);
  ctx.fillRect(canvas.width-10,canvas.height/2-50,10,100);

  // Goal celebration
  if(goalAnimation>0){
    ctx.fillStyle='rgba(255,255,0,'+goalAnimation/30+')';
    ctx.font='40px Comic Sans MS';
    ctx.fillText('GOAL!',canvas.width/2-60,canvas.height/2);
    goalAnimation--;
  }

  // Players
  players.forEach(p=>{
    ctx.fillStyle=p.color;
    ctx.beginPath(); ctx.arc(p.x,p.y,20,0,Math.PI*2);
    ctx.fill();

    // Charge indicator
    if(p.holding && p.charge>0){
      ctx.strokeStyle='white';
      ctx.lineWidth=2;
      ctx.beginPath();
      ctx.arc(p.x,p.y,20+p.charge/2,0,Math.PI*2);
      ctx.stroke();
    }
  });

  // Ball
  ctx.fillStyle='white';
  ctx.beginPath(); ctx.arc(ball.x,ball.y,12,0,Math.PI*2);
  ctx.fill();

  // Scores
  ctx.fillStyle='white';
  ctx.font='20px Comic Sans MS';
  ctx.fillText(players[0].score,50,30);
  ctx.fillText(players[1].score,canvas.width-50,30);

  // Tournament standings
  if(gameMode==='tournament'){
    ctx.fillText(`Tournament: Player ${tournamentStandings[0].score} - AI ${tournamentStandings[1].score}`,canvas.width/2-100,30);
  }
}

// Start the menu visible
document.getElementById('menu').style.display='block';
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Soccer Pong 2P</title>
<style>
body {
  margin: 0;
  background: #4CAF50;
  font-family: 'Comic Sans MS', cursive, sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

#game-container {
  position: relative;
}

canvas {
  background: #3e8e41;
  border: 4px solid #fff;
  border-radius: 10px;
  display: block;
}

.ui-overlay {
  position: absolute;
  top:0; left:0;
  width:100%; height:100%;
  display:flex;
  flex-direction: column;
  justify-content:center;
  align-items:center;
  background: rgba(0,0,0,0.7);
  color: #fff;
  font-size: 24px;
  z-index: 10;
}

.hidden { display: none; }

button {
  padding: 10px 20px;
  margin-top: 15px;
  font-size: 18px;
  cursor: pointer;
}
</style>
</head>
<body>

<div id="game-container">
  <canvas id="gameCanvas" width="800" height="500"></canvas>

  <div id="start-screen" class="ui-overlay">
    <h1>Soccer Pong 2P</h1>
    <button onclick="startGame()">Start Tournament</button>
    <p>P1: WASD + F Shoot + G Dash</p>
    <p>P2: Arrows + / Shoot + Shift Dash</p>
  </div>

  <div id="win-screen" class="ui-overlay hidden">
    <h1 id="winner-text"></h1>
    <p id="tournament-text"></p>
    <button onclick="nextRound()">Next Round</button>
  </div>
</div>

<script>
// Canvas
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// Game settings
const PLAYER_RADIUS = 20;
const BALL_RADIUS = 12;
const DASH_SPEED = 12;
const MOVE_SPEED = 5;
const FRICTION = 0.9;
const GOAL_WIDTH = 100;
const WIN_SCORE = 3; // tournament best of 3

// Players
let players = [
  {x: 100, y: canvas.height/2, color:'blue', up:'w', down:'s', left:'a', right:'d', shoot:'f', dash:'g', dx:0, dy:0, ball:null, score:0},
  {x: canvas.width-100, y: canvas.height/2, color:'red', up:'ArrowUp', down:'ArrowDown', left:'ArrowLeft', right:'ArrowRight', shoot:'/', dash:'Shift', dx:0, dy:0, ball:null, score:0}
];

// Ball
let ball = {x: canvas.width/2, y: canvas.height/2, vx:0, vy:0, heldBy:null, charge:0};

// Game state
let keys = {};
let round = 1;
let maxRounds = 3;
let gameRunning = false;

// Sound effects
function playSound(type){
  const audioCtx = new (window.AudioContext||window.webkitAudioContext)();
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
  if(type==='shoot'){ osc.type='square'; osc.frequency.setValueAtTime(800,audioCtx.currentTime); }
  else if(type==='goal'){ osc.type='triangle'; osc.frequency.setValueAtTime(200,audioCtx.currentTime); }
  else if(type==='dash'){ osc.type='sawtooth'; osc.frequency.setValueAtTime(500,audioCtx.currentTime);}
  osc.start(); osc.stop(audioCtx.currentTime+0.1);
}

// Input
window.addEventListener('keydown', e=>{ keys[e.key]=true; });
window.addEventListener('keyup', e=>{ keys[e.key]=false; if(e.key==='f' || e.key==='/') ball.charge=0; });

// Start game
function startGame(){
  document.getElementById('start-screen').classList.add('hidden');
  resetRound();
  gameRunning=true;
  requestAnimationFrame(gameLoop);
}

// Reset round
function resetRound(){
  ball.x = canvas.width/2; ball.y = canvas.height/2; ball.vx=0; ball.vy=0; ball.heldBy=null; ball.charge=0;
  players[0].x=100; players[0].y=canvas.height/2; players[0].dx=0; players[0].dy=0; players[0].ball=null;
  players[1].x=canvas.width-100; players[1].y=canvas.height/2; players[1].dx=0; players[1].dy=0; players[1].ball=null;
}

// Game loop
function gameLoop(){
  if(!gameRunning) return;
  update();
  draw();
  requestAnimationFrame(gameLoop);
}

// Update
function update(){
  // Player movement
  players.forEach(p=>{
    p.dx=0; p.dy=0;
    if(keys[p.left]) p.dx=-MOVE_SPEED;
    if(keys[p.right]) p.dx=MOVE_SPEED;
    if(keys[p.up]) p.dy=-MOVE_SPEED;
    if(keys[p.down]) p.dy=MOVE_SPEED;

    // Dash
    if(keys[p.dash]){
      p.dx*=DASH_SPEED/MOVE_SPEED; p.dy*=DASH_SPEED/MOVE_SPEED;
      // Steal ball if colliding opponent
      let other = players.find(op=>op!==p);
      let dist = Math.hypot(p.x-other.x,p.y-other.y);
      if(dist<PLAYER_RADIUS*2 && other.ball){ 
        other.ball.heldBy=null; 
        p.ball=ball; 
        ball.heldBy=p;
        playSound('dash');
      }
    }

    p.x+=p.dx; p.y+=p.dy;
    p.x=Math.max(PLAYER_RADIUS,Math.min(canvas.width-PLAYER_RADIUS,p.x));
    p.y=Math.max(PLAYER_RADIUS,Math.min(canvas.height-PLAYER_RADIUS,p.y));
  });

  // Shooting
  players.forEach(p=>{
    if(keys[p.shoot] && p.ball && p.ball.heldBy===p){
      // Charge shot
      ball.charge+=0.5;
      if(ball.charge>10) ball.charge=10;

      if(keys['ArrowUp'] || keys['w']) ball.vy=-10*ball.charge/5;
      else if(keys['ArrowDown'] || keys['s']) ball.vy=10*ball.charge/5;
      else ball.vy=0;

      if(keys['ArrowLeft'] || keys['a']) ball.vx=-10*ball.charge/5;
      else if(keys['ArrowRight'] || keys['d']) ball.vx=10*ball.charge/5;
      else if(ball.vx===0) ball.vx=(p===players[0]?5:-5);

      ball.heldBy=null;
      playSound('shoot');
    }
  });

  // Ball follow player
  if(ball.heldBy){
    ball.x=ball.heldBy.x + ball.heldBy.dx;
    ball.y=ball.heldBy.y + ball.heldBy.dy;
  }else{
    ball.x+=ball.vx; ball.y+=ball.vy;
    ball.vx*=FRICTION; ball.vy*=FRICTION;

    // Collision with players
    players.forEach(p=>{
      let dist=Math.hypot(ball.x-p.x,ball.y-p.y);
      if(dist<PLAYER_RADIUS+BALL_RADIUS){
        ball.heldBy=p;
        ball.vx=0; ball.vy=0;
      }
    });
  }

  // Check goals
  if(ball.x<0+BALL_RADIUS && Math.abs(ball.y-canvas.height/2)<GOAL_WIDTH/2){
    players[1].score++; playSound('goal'); showWinScreen(players[1]); return;
  }
  if(ball.x>canvas.width-BALL_RADIUS && Math.abs(ball.y-canvas.height/2)<GOAL_WIDTH/2){
    players[0].score++; playSound('goal'); showWinScreen(players[0]); return;
  }
}

// Draw
function draw(){
  // Pitch
  ctx.fillStyle='#3e8e41'; ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.strokeStyle='#fff'; ctx.lineWidth=3;
  ctx.beginPath(); ctx.moveTo(canvas.width/2,0); ctx.lineTo(canvas.width/2,canvas.height); ctx.stroke();
  // Goals
  ctx.fillStyle='yellow'; ctx.fillRect(0,canvas.height/2-GOAL_WIDTH/2,10,GOAL_WIDTH);
  ctx.fillRect(canvas.width-10,canvas.height/2-GOAL_WIDTH/2,10,GOAL_WIDTH);

  // Players
  players.forEach(p=>{
    ctx.fillStyle=p.color;
    ctx.beginPath();
    ctx.arc(p.x,p.y,PLAYER_RADIUS,0,Math.PI*2);
    ctx.fill();
  });

  // Ball
  ctx.fillStyle='white';
  ctx.beginPath();
  ctx.arc(ball.x,ball.y,BALL_RADIUS,0,Math.PI*2);
  ctx.fill();
}

// Win screen
function showWinScreen(winner){
  gameRunning=false;
  document.getElementById('win-screen').classList.remove('hidden');
  document.getElementById('winner-text').innerText=winner.color.toUpperCase()+' WINS!';
  document.getElementById('tournament-text').innerText=`Score: P1 ${players[0].score} - P2 ${players[1].score}`;
}

// Next round
function nextRound(){
  document.getElementById('win-screen').classList.add('hidden');
  round++;
  if(round>maxRounds){
    // Tournament over
    let winner=players[0].score>players[1].score?'Blue':'Red';
    alert(`Tournament over! ${winner} wins!`);
    round=1;
    players[0].score=0; players[1].score=0;
  }
  resetRound();
  gameRunning=true;
  requestAnimationFrame(gameLoop);
}
</script>

</body>
</html>

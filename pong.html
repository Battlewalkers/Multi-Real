<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Soccer Battle</title>

<style>
body {
  margin: 0;
  background: #f5f5f5;
  font-family: 'Comic Sans MS', cursive, sans-serif;
  text-align: center;
}

header {
  background: #4CAF50;
  color: white;
  padding: 20px;
  font-size: 28px;
}

footer {
  background: #4CAF50;
  color: white;
  padding: 15px;
  margin-top: 40px;
}

.game-container {
  background: #FFEB3B;
  margin: 40px auto;
  padding: 30px;
  border-radius: 20px;
  box-shadow: 0 5px 15px rgba(0,0,0,0.2);
  max-width: 900px;
}

canvas {
  background: #2E7D32;
  border-radius: 12px;
  display: block;
  margin: 20px auto;
}

.score {
  font-size: 22px;
  font-weight: bold;
}
</style>
</head>

<body>

<header>⚽ Soccer Battle</header>

<div class="game-container">

<div class="score">
Player 1: <span id="p1">0</span> |
Player 2: <span id="p2">0</span>
</div>

<canvas id="game" width="800" height="450"></canvas>

<p>
P1: WASD | Shoot: F | Dash: G <br>
P2: Arrows | Shoot: / | Dash: .
</p>

<button onclick="startGame()">Start Game</button>

</div>

<footer>© 2026 Multi</footer>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let keys = {};

let p1 = {x:200, y:225, r:20, speed:4, hasBall:false, dash:0};
let p2 = {x:600, y:225, r:20, speed:4, hasBall:false, dash:0};

let ball = {x:400, y:225, r:10, vx:0, vy:0};

let score1 = 0;
let score2 = 0;

let gameInterval;

function startGame(){
  score1 = 0;
  score2 = 0;
  document.getElementById("p1").innerText = 0;
  document.getElementById("p2").innerText = 0;
  resetPositions();
  clearInterval(gameInterval);
  gameInterval = setInterval(gameLoop, 1000/60);
}

function resetPositions(){
  p1.x = 200; p1.y = 225; p1.hasBall = false;
  p2.x = 600; p2.y = 225; p2.hasBall = false;
  ball.x = 400; ball.y = 225;
  ball.vx = 0; ball.vy = 0;
}

function gameLoop(){
  update();
  draw();
}

function update(){

  movePlayer(p1, "w","s","a","d");
  movePlayer(p2, "ArrowUp","ArrowDown","ArrowLeft","ArrowRight");

  handleBall(p1);
  handleBall(p2);

  // Ball movement
  if(!p1.hasBall && !p2.hasBall){
    ball.x += ball.vx;
    ball.y += ball.vy;
    ball.vx *= 0.98;
    ball.vy *= 0.98;
  }

  // Goals
  if(ball.x < 0){
    score2++;
    document.getElementById("p2").innerText = score2;
    resetPositions();
  }

  if(ball.x > canvas.width){
    score1++;
    document.getElementById("p1").innerText = score1;
    resetPositions();
  }
}

function movePlayer(player, up, down, left, right){

  let currentSpeed = player.speed;

  if(player.dash > 0){
    currentSpeed = 8;
    player.dash--;
  }

  if(keys[up]) player.y -= currentSpeed;
  if(keys[down]) player.y += currentSpeed;
  if(keys[left]) player.x -= currentSpeed;
  if(keys[right]) player.x += currentSpeed;

  // Stay inside field
  if(player.x < player.r) player.x = player.r;
  if(player.x > canvas.width - player.r) player.x = canvas.width - player.r;
  if(player.y < player.r) player.y = player.r;
  if(player.y > canvas.height - player.r) player.y = canvas.height - player.r;

  // If holding ball, move ball with player
  if(player.hasBall){
    ball.x = player.x;
    ball.y = player.y;
  }
}

function handleBall(player){

  let dx = ball.x - player.x;
  let dy = ball.y - player.y;
  let distance = Math.sqrt(dx*dx + dy*dy);

  if(distance < player.r + ball.r){
    player.hasBall = true;
    if(player === p1) p2.hasBall = false;
    if(player === p2) p1.hasBall = false;
  }
}

function shoot(player, directionX, directionY){
  if(player.hasBall){
    player.hasBall = false;
    ball.vx = directionX * 10;
    ball.vy = directionY * 10;
  }
}

window.addEventListener("keydown", e=>{
  keys[e.key] = true;

  // P1 Shoot
  if(e.key === "f") shoot(p1, 1, 0);

  // P2 Shoot
  if(e.key === "/") shoot(p2, -1, 0);

  // Dash
  if(e.key === "g") p1.dash = 10;
  if(e.key === ".") p2.dash = 10;
});

window.addEventListener("keyup", e=>{
  keys[e.key] = false;
});

function draw(){

  ctx.clearRect(0,0,canvas.width,canvas.height);

  // Field lines
  ctx.strokeStyle = "white";
  ctx.lineWidth = 4;

  ctx.beginPath();
  ctx.moveTo(canvas.width/2,0);
  ctx.lineTo(canvas.width/2,canvas.height);
  ctx.stroke();

  ctx.beginPath();
  ctx.arc(canvas.width/2,canvas.height/2,70,0,Math.PI*2);
  ctx.stroke();

  // Goals
  ctx.strokeRect(0,canvas.height/2-60,10,120);
  ctx.strokeRect(canvas.width-10,canvas.height/2-60,10,120);

  // Players
  ctx.fillStyle = "blue";
  ctx.beginPath();
  ctx.arc(p1.x,p1.y,p1.r,0,Math.PI*2);
  ctx.fill();

  ctx.fillStyle = "red";
  ctx.beginPath();
  ctx.arc(p2.x,p2.y,p2.r,0,Math.PI*2);
  ctx.fill();

  // Ball
  ctx.fillStyle = "white";
  ctx.beginPath();
  ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);
  ctx.fill();
}
</script>

</body>
</html>

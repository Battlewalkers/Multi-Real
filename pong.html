<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Multi - Soccer</title>

<style>
body {
  margin:0;
  font-family: Comic Sans MS, cursive;
  background:#4CAF50;
  text-align:center;
  color:white;
}

canvas {
  background:#2e7d32;
  border:4px solid white;
  border-radius:10px;
  margin-top:20px;
}

button {
  padding:12px 25px;
  margin:8px;
  font-size:18px;
  border:none;
  border-radius:10px;
  background:#FFEB3B;
  cursor:pointer;
}

button:hover {
  background:#fdd835;
}

.menu {
  margin-top:60px;
}
</style>
</head>
<body>

<!-- MAIN MENU -->
<div id="mainMenu" class="menu">
  <h1>⚽ Multi Soccer</h1>
  <button onclick="showPlayMenu()">Play</button><br>
  <button onclick="showHowTo()">How To Play</button>
</div>

<!-- HOW TO PLAY -->
<div id="howTo" class="menu" style="display:none;">
  <h2>Controls</h2>
  <p>
  Player 1:<br>
  Arrow Keys = Move<br>
  Right Shift = Dash / Tackle<br>
  . = Shoot
  </p>
  <p>
  Player 2:<br>
  W A S D = Move<br>
  F = Dash / Tackle<br>
  G = Shoot
  </p>
  <button onclick="backToMain()">Back</button>
</div>

<!-- PLAY MENU -->
<div id="playMenu" class="menu" style="display:none;">
  <h2>Select Mode</h2>
  <button onclick="selectMode('friendly')">Friendly 1v1</button><br>
  <button onclick="selectMode('tournament')">Tournament</button><br>
  <button onclick="backToMain()">Back</button>
</div>

<!-- AI SELECT -->
<div id="aiMenu" class="menu" style="display:none;">
  <h2>Play Against?</h2>
  <button onclick="startGame(false)">Another Player</button><br>
  <button onclick="showDifficulty()">AI</button><br>
  <button onclick="backToPlay()">Back</button>
</div>

<!-- DIFFICULTY -->
<div id="difficultyMenu" class="menu" style="display:none;">
  <h2>Select Difficulty</h2>
  <button onclick="startGame(true,'easy')">Easy</button>
  <button onclick="startGame(true,'medium')">Medium</button>
  <button onclick="startGame(true,'hard')">Hard</button><br>
  <button onclick="backToAI()">Back</button>
</div>

<canvas id="gameCanvas" width="900" height="500" style="display:none;"></canvas>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

let keys = {};
let players;
let ball;
let gameMode = "friendly";
let vsAI = false;
let aiDifficulty = "easy";

window.addEventListener("keydown", e => keys[e.key] = true);
window.addEventListener("keyup", e => keys[e.key] = false);

/* ---------------- MENU FUNCTIONS ---------------- */

function showPlayMenu(){
  hideAll();
  document.getElementById("playMenu").style.display="block";
}

function showHowTo(){
  hideAll();
  document.getElementById("howTo").style.display="block";
}

function backToMain(){
  hideAll();
  document.getElementById("mainMenu").style.display="block";
}

function backToPlay(){
  hideAll();
  document.getElementById("playMenu").style.display="block";
}

function backToAI(){
  hideAll();
  document.getElementById("aiMenu").style.display="block";
}

function selectMode(mode){
  gameMode = mode;
  hideAll();
  document.getElementById("aiMenu").style.display="block";
}

function showDifficulty(){
  hideAll();
  document.getElementById("difficultyMenu").style.display="block";
}

function hideAll(){
  document.getElementById("mainMenu").style.display="none";
  document.getElementById("howTo").style.display="none";
  document.getElementById("playMenu").style.display="none";
  document.getElementById("aiMenu").style.display="none";
  document.getElementById("difficultyMenu").style.display="none";
}

/* ---------------- GAME START ---------------- */

function startGame(ai=false,difficulty="easy"){
  vsAI = ai;
  aiDifficulty = difficulty;

  hideAll();
  canvas.style.display="block";

  init();
  gameLoop();
}

function init(){
  players = [
    {
      x:150,
      y:250,
      color:"blue",
      left:"ArrowLeft",
      right:"ArrowRight",
      up:"ArrowUp",
      down:"ArrowDown",
      dash:"Shift",
      shoot:".",
      score:0,
      holding:false,
      dashCooldown:0
    },
    {
      x:750,
      y:250,
      color:"red",
      left:"a",
      right:"d",
      up:"w",
      down:"s",
      dash:"f",
      shoot:"g",
      score:0,
      holding:false,
      dashCooldown:0,
      ai:vsAI
    }
  ];

  ball = {
    x:450,
    y:250,
    vx:0,
    vy:0,
    holder:null
  };
}

/* ---------------- GAME LOOP ---------------- */

function gameLoop(){
  update();
  draw();
  requestAnimationFrame(gameLoop);
}

/* ---------------- UPDATE ---------------- */

function update(){

  players.forEach((p,i)=>{

    if(p.dashCooldown>0) p.dashCooldown--;

    let speed = 4;

    if(p.ai){
      aiMove(p);
    } else {
      p.dx = 0;
      p.dy = 0;

      if(keys[p.left]) p.dx=-speed;
      if(keys[p.right]) p.dx=speed;
      if(keys[p.up]) p.dy=-speed;
      if(keys[p.down]) p.dy=speed;
    }

    // DASH
    if(keys[p.dash] && p.dashCooldown===0){
      p.dx *= 2.5;
      p.dy *= 2.5;
      p.dashCooldown = 60;

      // steal ball
      let opponent = players[1-i];
      if(opponent.holding &&
        Math.hypot(p.x-opponent.x,p.y-opponent.y)<40){
          opponent.holding=false;
          ball.holder=p;
          p.holding=true;
      }
    }

    p.x += p.dx || 0;
    p.y += p.dy || 0;

    p.x = Math.max(20,Math.min(canvas.width-20,p.x));
    p.y = Math.max(20,Math.min(canvas.height-20,p.y));
  });

  // BALL
  if(ball.holder){
    ball.x = ball.holder.x;
    ball.y = ball.holder.y;
  } else {
    ball.x += ball.vx;
    ball.y += ball.vy;
    ball.vx *= 0.98;
    ball.vy *= 0.98;

    // pickup
    players.forEach(p=>{
      if(Math.hypot(ball.x-p.x,ball.y-p.y)<30){
        ball.holder=p;
        p.holding=true;
      }
    });
  }

  // SHOOT
  players.forEach(p=>{
    if(keys[p.shoot] && p.holding){
      let dir = (p===players[0]) ? 1 : -1;
      ball.vx = dir * 8;
      ball.vy = 0;
      ball.holder=null;
      p.holding=false;
    }
  });

  // GOALS
  if(ball.x<0 && Math.abs(ball.y-250)<70){
    players[1].score++;
    reset();
  }

  if(ball.x>900 && Math.abs(ball.y-250)<70){
    players[0].score++;
    reset();
  }
}

function reset(){
  init();
}

/* ---------------- AI ---------------- */

function aiMove(p){
  let target = ball.holder ? ball.holder : ball;
  let speed = 3;
  if(aiDifficulty==="medium") speed=4;
  if(aiDifficulty==="hard") speed=5;

  p.dx = Math.sign(target.x - p.x) * speed;
  p.dy = Math.sign(target.y - p.y) * speed;
}

/* ---------------- DRAW ---------------- */

function draw(){

  // Grass
  ctx.fillStyle="#2e7d32";
  ctx.fillRect(0,0,900,500);

  // Middle line
  ctx.strokeStyle="white";
  ctx.lineWidth=4;
  ctx.beginPath();
  ctx.moveTo(450,0);
  ctx.lineTo(450,500);
  ctx.stroke();

  // Center circle
  ctx.beginPath();
  ctx.arc(450,250,70,0,Math.PI*2);
  ctx.stroke();

  // Goals
  ctx.fillStyle="yellow";
  ctx.fillRect(0,180,10,140);
  ctx.fillRect(890,180,10,140);

  // Players
  players.forEach(p=>{
    ctx.fillStyle=p.color;
    ctx.beginPath();
    ctx.arc(p.x,p.y,20,0,Math.PI*2);
    ctx.fill();
  });

  // Ball
  ctx.fillStyle="white";
  ctx.beginPath();
  ctx.arc(ball.x,ball.y,12,0,Math.PI*2);
  ctx.fill();

  // Score
  ctx.font="25px Comic Sans MS";
  ctx.fillText(players[0].score,100,40);
  ctx.fillText(players[1].score,800,40);
}

</script>
</body>
</html>

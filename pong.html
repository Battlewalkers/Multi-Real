<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Ultimate League Soccer</title>
<style>
body{
    margin:0;
    overflow:hidden;
    background:#0a2e0a;
    font-family:Arial;
    color:white;
    text-align:center;
}
canvas{
    background:#1f7a1f;
    display:block;
    margin:auto;
}
#ui{
    position:absolute;
    top:10px;
    left:50%;
    transform:translateX(-50%);
}
button{padding:6px;margin:4px;}
#menu{
    position:absolute;
    top:40%;
    left:50%;
    transform:translate(-50%,-50%);
}
.joystick{
    position:absolute;
    bottom:30px;
    left:30px;
    width:120px;
    height:120px;
    background:rgba(255,255,255,0.1);
    border-radius:50%;
}
</style>
</head>
<body>

<div id="menu">
<h1>⚽ Ultimate League Soccer ⚽</h1>
<button onclick="startGame()">Start League</button>
<br><br>
<label>Team Color:</label>
<input type="color" id="teamColor" value="#2196f3">
</div>

<div id="ui"></div>
<canvas id="game" width="1400" height="800"></canvas>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");
let keys={};
let gameStarted=false;
let coins=100;
let matchTime=180;
let timer=matchTime;
let leagueWins=0;

let pitch={
    width:1400,
    height:800
};

let ball={
    x:700,
    y:400,
    vx:0,
    vy:0,
    r:10
};

let playerTeam=[];
let aiTeam=[];

function randomName(){
    const first=["Liam","Noah","Ethan","Mason","Leo","Kai","Jayden","Axel","Ryder","Zane"];
    const last=["Storm","Blaze","Knight","Falcon","Frost","Shadow","Volt","Hunter","Cross","Steel"];
    return first[Math.floor(Math.random()*first.length)]+" "+
           last[Math.floor(Math.random()*last.length)];
}

function createPlayer(x,y,color,isAI=false){
    return{
        name:randomName(),
        x,y,
        vx:0,vy:0,
        speed:2+Math.random()*1.5,
        power:4+Math.random()*3,
        stamina:100,
        maxStamina:100,
        color,
        r:15,
        isAI,
        down:false,
        downTimer:0
    }
}

function initTeams(){
    playerTeam=[];
    aiTeam=[];
    let color=document.getElementById("teamColor").value;

    for(let i=0;i<10;i++){
        playerTeam.push(createPlayer(200,100+i*60,color,false));
        aiTeam.push(createPlayer(1200,100+i*60,"red",true));
    }
}

function startGame(){
    document.getElementById("menu").style.display="none";
    gameStarted=true;
    initTeams();
    requestAnimationFrame(loop);
}

document.addEventListener("keydown",e=>keys[e.key]=true);
document.addEventListener("keyup",e=>keys[e.key]=false);

function updatePlayer(p){
    if(p.down){
        p.downTimer--;
        if(p.downTimer<=0)p.down=false;
        return;
    }

    let dirX=0,dirY=0;

    if(!p.isAI){
        if(keys["w"])dirY=-1;
        if(keys["s"])dirY=1;
        if(keys["a"])dirX=-1;
        if(keys["d"])dirX=1;
    }else{
        let dx=ball.x-p.x;
        let dy=ball.y-p.y;
        let dist=Math.hypot(dx,dy);
        if(dist>5){
            dirX=dx/dist;
            dirY=dy/dist;
        }
    }

    p.x+=dirX*p.speed;
    p.y+=dirY*p.speed;

    p.x=Math.max(0,Math.min(pitch.width,p.x));
    p.y=Math.max(0,Math.min(pitch.height,p.y));

    if(!p.isAI){
        if(keys["f"] && p.stamina>1){
            p.x+=dirX*p.speed*3;
            p.y+=dirY*p.speed*3;
            p.stamina-=1;
        }

        if(keys["h"] && p.stamina>5){
            slideTackle(p);
            p.stamina-=5;
        }

        if(keys["t"] && p.stamina>10){
            p.speed*=1.5;
            p.stamina-=10;
            setTimeout(()=>p.speed/=1.5,2000);
        }

        if(keys["g"]){
            shoot(p);
        }
    }else{
        if(Math.random()<0.005) shoot(p);
    }

    p.stamina=Math.min(p.maxStamina,p.stamina+0.05);
}

function shoot(p){
    let dx=ball.x-p.x;
    let dy=ball.y-p.y;
    let dist=Math.hypot(dx,dy);
    if(dist<25 && p.stamina>2){
        let power=p.power*(p.stamina/100);
        ball.vx=dx/dist*power;
        ball.vy=dy/dist*power;
        p.stamina-=2;
    }
}

function slideTackle(p){
    aiTeam.forEach(op=>{
        let d=Math.hypot(op.x-p.x,op.y-p.y);
        if(d<30){
            op.down=true;
            op.downTimer=60;
        }
    });
}

function updateBall(){
    ball.x+=ball.vx;
    ball.y+=ball.vy;
    ball.vx*=0.99;
    ball.vy*=0.99;

    if(ball.y<0||ball.y>pitch.height)ball.vy*=-1;

    if(ball.x<0){
        leagueWins++;
        coins+=50;
        resetMatch();
    }
    if(ball.x>pitch.width){
        resetMatch();
    }
}

function resetMatch(){
    timer=matchTime;
    ball.x=700;
    ball.y=400;
    ball.vx=ball.vy=0;
}

function drawPitch(){
    ctx.fillStyle="#1f7a1f";
    ctx.fillRect(0,0,pitch.width,pitch.height);
    ctx.strokeStyle="white";
    ctx.lineWidth=4;
    ctx.strokeRect(0,0,pitch.width,pitch.height);
    ctx.beginPath();
    ctx.arc(700,400,100,0,Math.PI*2);
    ctx.stroke();
}

function drawPlayer(p){
    ctx.beginPath();
    ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
    ctx.fillStyle=p.color;
    ctx.fill();

    ctx.fillStyle="white";
    ctx.fillRect(p.x-15,p.y-25,30,4);
    ctx.fillStyle="green";
    ctx.fillRect(p.x-15,p.y-25,30*(p.stamina/p.maxStamina),4);
}

function loop(){
    ctx.clearRect(0,0,canvas.width,canvas.height);

    drawPitch();

    playerTeam.forEach(updatePlayer);
    aiTeam.forEach(updatePlayer);
    updateBall();

    playerTeam.forEach(drawPlayer);
    aiTeam.forEach(drawPlayer);

    ctx.beginPath();
    ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);
    ctx.fillStyle="white";
    ctx.fill();

    timer--;
    ctx.fillStyle="white";
    ctx.fillText("Time: "+Math.floor(timer/60),650,30);
    ctx.fillText("Coins: "+coins,20,30);
    ctx.fillText("League Wins: "+leagueWins,20,60);

    requestAnimationFrame(loop);
}
</script>
</body>
</html>

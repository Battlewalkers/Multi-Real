<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Multi - Soccer</title>

<style>
body{
  margin:0;
  overflow:hidden;
  font-family:Comic Sans MS,cursive;
  background:#1b5e20;
  color:white;
}

canvas{
  display:block;
}

.menu{
  position:absolute;
  width:100%;
  text-align:center;
  top:20%;
}

button{
  padding:12px 25px;
  margin:8px;
  font-size:18px;
  border:none;
  border-radius:10px;
  background:#FFEB3B;
  cursor:pointer;
}

button:hover{ background:#fdd835; }
</style>
</head>
<body>

<div id="mainMenu" class="menu">
  <h1>⚽ Multi Soccer</h1>
  <button onclick="showTeamSelect()">Play</button><br>
</div>

<div id="teamMenu" class="menu" style="display:none;">
  <h2>Select Your Team</h2>
  <button onclick="selectTeam('blue')">Blue Sharks</button>
  <button onclick="selectTeam('red')">Red Dragons</button>
  <button onclick="selectTeam('purple')">Purple Ninjas</button>
  <button onclick="selectTeam('orange')">Orange Tigers</button>
</div>

<div id="modeMenu" class="menu" style="display:none;">
  <h2>Select Mode</h2>
  <button onclick="startGame('friendly')">Friendly</button>
  <button onclick="startGame('tournament')">Tournament</button>
</div>

<canvas id="game"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let keys = {};
window.addEventListener("keydown",e=>keys[e.key]=true);
window.addEventListener("keyup",e=>keys[e.key]=false);

let player, opponent, ball;
let gameMode="friendly";
let bracketStage=0;
let playerTeam="blue";

/* ---------------- MENUS ---------------- */

function hideMenus(){
  document.getElementById("mainMenu").style.display="none";
  document.getElementById("teamMenu").style.display="none";
  document.getElementById("modeMenu").style.display="none";
}

function showTeamSelect(){
  hideMenus();
  document.getElementById("teamMenu").style.display="block";
}

function selectTeam(team){
  playerTeam=team;
  hideMenus();
  document.getElementById("modeMenu").style.display="block";
}

function startGame(mode){
  gameMode=mode;
  hideMenus();
  init();
  loop();
}

/* ---------------- INIT ---------------- */

function init(){
  player={
    x:150,
    y:canvas.height/2,
    color:playerTeam,
    stamina:100,
    holding:false,
    charge:0,
    score:0
  };

  opponent={
    x:canvas.width-150,
    y:canvas.height/2,
    color:"white",
    stamina:100,
    holding:false,
    score:0
  };

  ball={
    x:canvas.width/2,
    y:canvas.height/2,
    vx:0,
    vy:0,
    holder:null
  };
}

/* ---------------- LOOP ---------------- */

function loop(){
  update();
  draw();
  requestAnimationFrame(loop);
}

/* ---------------- UPDATE ---------------- */

function update(){

  let speed=5;

  // movement
  if(keys["ArrowLeft"]) player.x-=speed;
  if(keys["ArrowRight"]) player.x+=speed;
  if(keys["ArrowUp"]) player.y-=speed;
  if(keys["ArrowDown"]) player.y+=speed;

  // DASH (cost stamina)
  if(keys["Shift"] && player.stamina>20){
    player.x += (keys["ArrowRight"]?10:0);
    player.x -= (keys["ArrowLeft"]?10:0);
    player.y += (keys["ArrowDown"]?10:0);
    player.y -= (keys["ArrowUp"]?10:0);
    player.stamina-=1.5;
  }

  // stamina regen
  if(player.stamina<100) player.stamina+=0.3;

  // keep inside screen
  player.x=Math.max(20,Math.min(canvas.width-20,player.x));
  player.y=Math.max(20,Math.min(canvas.height-20,player.y));

  // AI simple follow
  opponent.x += (ball.x>opponent.x?3:-3);
  opponent.y += (ball.y>opponent.y?3:-3);

  // BALL HOLD
  if(ball.holder){
    ball.x=ball.holder.x;
    ball.y=ball.holder.y;
  }else{
    ball.x+=ball.vx;
    ball.y+=ball.vy;
    ball.vx*=0.98;
    ball.vy*=0.98;

    if(dist(player,ball)<30){
      ball.holder=player;
      player.holding=true;
    }
    if(dist(opponent,ball)<30){
      ball.holder=opponent;
      opponent.holding=true;
    }
  }

  // POWER SHOT (hold .)
  if(keys["."] && player.holding){
    if(player.charge<50) player.charge++;
  }else if(player.charge>0 && player.holding){
    ball.vx=10+player.charge/2;
    ball.vy=0;
    ball.holder=null;
    player.holding=false;
    player.charge=0;
  }

  // GOALS
  let goalSize=120;

  if(ball.x<0 && Math.abs(ball.y-canvas.height/2)<goalSize){
    opponent.score++;
    reset();
  }

  if(ball.x>canvas.width && Math.abs(ball.y-canvas.height/2)<goalSize){
    player.score++;
    if(gameMode==="tournament"){
      bracketStage++;
      if(bracketStage>=2){
        alert("🏆 YOU WIN THE TOURNAMENT!");
        bracketStage=0;
      }
    }
    reset();
  }
}

function reset(){
  ball.x=canvas.width/2;
  ball.y=canvas.height/2;
  ball.vx=0;
  ball.vy=0;
  ball.holder=null;
  player.holding=false;
  opponent.holding=false;
}

/* ---------------- DRAW ---------------- */

function draw(){

  // Grass stripes
  for(let i=0;i<canvas.height;i+=40){
    ctx.fillStyle=(i/40)%2==0?"#2e7d32":"#388e3c";
    ctx.fillRect(0,i,canvas.width,40);
  }

  // Middle line
  ctx.strokeStyle="white";
  ctx.lineWidth=4;
  ctx.beginPath();
  ctx.moveTo(canvas.width/2,0);
  ctx.lineTo(canvas.width/2,canvas.height);
  ctx.stroke();

  // Center circle
  ctx.beginPath();
  ctx.arc(canvas.width/2,canvas.height/2,80,0,Math.PI*2);
  ctx.stroke();

  // Goals
  ctx.fillStyle="yellow";
  ctx.fillRect(0,canvas.height/2-120,10,240);
  ctx.fillRect(canvas.width-10,canvas.height/2-120,10,240);

  // Players
  drawPlayer(player);
  drawPlayer(opponent);

  // Ball
  ctx.fillStyle="white";
  ctx.beginPath();
  ctx.arc(ball.x,ball.y,12,0,Math.PI*2);
  ctx.fill();

  // SCOREBOARD (fixed)
  ctx.fillStyle="black";
  ctx.fillRect(canvas.width/2-120,10,240,50);
  ctx.fillStyle="white";
  ctx.font="30px Comic Sans MS";
  ctx.fillText(player.score+"  -  "+opponent.score,canvas.width/2-60,45);

  // STAMINA BAR
  ctx.fillStyle="black";
  ctx.fillRect(20,20,200,20);
  ctx.fillStyle="lime";
  ctx.fillRect(20,20,player.stamina*2,20);

  // TOURNAMENT INFO
  if(gameMode==="tournament"){
    ctx.fillText("Round: "+(bracketStage+1)+"/2",canvas.width-200,40);
  }
}

function drawPlayer(p){
  ctx.fillStyle=p.color;
  ctx.beginPath();
  ctx.arc(p.x,p.y,25,0,Math.PI*2);
  ctx.fill();
}

function dist(a,b){
  return Math.hypot(a.x-b.x,a.y-b.y);
}
</script>
</body>
</html>

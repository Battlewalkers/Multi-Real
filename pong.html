<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Ultimate 2 Player Soccer</title>
<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0f3d0f;
    color: white;
    text-align: center;
}

canvas {
    background: #1c6e1c;
    border: 4px solid white;
    display: none;
    margin-top: 20px;
}

button {
    padding: 10px 20px;
    margin: 10px;
    font-size: 16px;
    cursor: pointer;
}

.menu {
    margin-top: 80px;
}

.card {
    background: #222;
    padding: 10px;
    margin: 10px;
    display: inline-block;
    border-radius: 10px;
}
</style>
</head>
<body>

<div id="mainMenu" class="menu">
    <h1>⚽ Ultimate Soccer Showdown ⚽</h1>
    <button onclick="startGame()">Play</button>
    <button onclick="showHow()">How To Play</button>
    <button onclick="showCareer()">Career Mode</button>
</div>

<div id="howTo" style="display:none">
    <h2>How To Play</h2>
    <p>P1: WASD move | F Dash | G Shoot</p>
    <p>P2: Arrow Keys move | , Dash | . Shoot</p>
    <button onclick="goMenu()">Back</button>
</div>

<div id="career" style="display:none">
    <h2>Career Mode</h2>
    <div id="shop"></div>
    <p>Coins: <span id="coins"></span></p>
    <button onclick="goMenu()">Back</button>
</div>

<canvas id="gameCanvas" width="900" height="500"></canvas>

<script>
let canvas = document.getElementById("gameCanvas");
let ctx = canvas.getContext("2d");

let gameMode = "2p";
let keys = {};
let coins = localStorage.getItem("coins") ? parseInt(localStorage.getItem("coins")) : 100;

let playersAvailable = [
    {name:"Rookie", speed:3, power:5, cost:0},
    {name:"Speedster", speed:5, power:4, cost:50},
    {name:"Striker", speed:3, power:8, cost:75},
    {name:"Legend", speed:6, power:10, cost:150}
];

let selectedP1 = playersAvailable[0];
let selectedP2 = playersAvailable[0];

let player1, player2, ball;

function saveCoins(){
    localStorage.setItem("coins", coins);
}

function startGame(){
    document.getElementById("mainMenu").style.display="none";
    canvas.style.display="block";
    initGame();
}

function showHow(){
    document.getElementById("mainMenu").style.display="none";
    document.getElementById("howTo").style.display="block";
}

function showCareer(){
    document.getElementById("mainMenu").style.display="none";
    document.getElementById("career").style.display="block";
    renderShop();
}

function goMenu(){
    document.getElementById("howTo").style.display="none";
    document.getElementById("career").style.display="none";
    document.getElementById("mainMenu").style.display="block";
}

function renderShop(){
    let shop = document.getElementById("shop");
    shop.innerHTML="";
    document.getElementById("coins").innerText = coins;

    playersAvailable.forEach(p=>{
        let div = document.createElement("div");
        div.className="card";
        div.innerHTML = `<h3>${p.name}</h3>
        Speed: ${p.speed}<br>
        Power: ${p.power}<br>
        Cost: ${p.cost}
        <br><button onclick='buyPlayer("${p.name}")'>Buy/Select</button>`;
        shop.appendChild(div);
    });
}

function buyPlayer(name){
    let p = playersAvailable.find(x=>x.name===name);
    if(coins >= p.cost){
        coins -= p.cost;
        selectedP1 = p;
        alert("Selected " + p.name + " for P1");
        saveCoins();
        renderShop();
    } else alert("Not enough coins!");
}

function initGame(){
    player1 = {x:100,y:250,color:"blue",score:0,...selectedP1};
    player2 = {x:800,y:250,color:"red",score:0,...selectedP2};
    ball = {x:450,y:250,vx:0,vy:0};
    requestAnimationFrame(gameLoop);
}

document.addEventListener("keydown", e=>keys[e.key]=true);
document.addEventListener("keyup", e=>keys[e.key]=false);

function gameLoop(){
    update();
    draw();
    requestAnimationFrame(gameLoop);
}

function update(){
    // Player 1 Movement
    if(keys["w"]) player1.y -= player1.speed;
    if(keys["s"]) player1.y += player1.speed;
    if(keys["a"]) player1.x -= player1.speed;
    if(keys["d"]) player1.x += player1.speed;

    // Dash
    if(keys["f"]) player1.x += player1.speed*2;

    // Shoot
    if(keys["g"] && distance(player1,ball)<20){
        ball.vx = player1.power;
    }

    // Player 2 Movement
    if(keys["ArrowUp"]) player2.y -= player2.speed;
    if(keys["ArrowDown"]) player2.y += player2.speed;
    if(keys["ArrowLeft"]) player2.x -= player2.speed;
    if(keys["ArrowRight"]) player2.x += player2.speed;

    if(keys[","]) player2.x -= player2.speed*2;

    if(keys["."] && distance(player2,ball)<20){
        ball.vx = -player2.power;
    }

    // Ball movement
    ball.x += ball.vx;
    ball.y += ball.vy;
    ball.vx *= 0.98;

    // Goal detection
    if(ball.x < 0){
        player2.score++;
        coins += 20;
        resetBall();
    }
    if(ball.x > canvas.width){
        player1.score++;
        coins += 20;
        resetBall();
    }
}

function resetBall(){
    ball.x=450;
    ball.y=250;
    ball.vx=0;
}

function draw(){
    ctx.clearRect(0,0,canvas.width,canvas.height);

    ctx.fillStyle="white";
    ctx.fillRect(440,0,5,500);

    // Goals
    ctx.fillRect(0,200,10,100);
    ctx.fillRect(890,200,10,100);

    // Players
    drawPlayer(player1);
    drawPlayer(player2);

    // Ball
    ctx.beginPath();
    ctx.arc(ball.x,ball.y,10,0,Math.PI*2);
    ctx.fillStyle="white";
    ctx.fill();

    ctx.fillText(player1.name + " " + player1.score, 50,30);
    ctx.fillText(player2.name + " " + player2.score, 700,30);
}

function drawPlayer(p){
    ctx.beginPath();
    ctx.arc(p.x,p.y,20,0,Math.PI*2);
    ctx.fillStyle=p.color;
    ctx.fill();
}

function distance(a,b){
    return Math.sqrt((a.x-b.x)**2 + (a.y-b.y)**2);
}
</script>
</body>
</html>

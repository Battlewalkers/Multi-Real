<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>LEGEND MODE Soccer</title>
<style>
body{margin:0;font-family:Arial;background:#0e1a2b;color:white;text-align:center;}
button{padding:8px 14px;margin:5px;border:none;border-radius:6px;font-weight:bold;cursor:pointer;}
.hidden{display:none;}
canvas{background:#1f7a1f;display:block;margin:10px auto;border:3px solid white;}
</style>
</head>
<body>

<div id="menu">
<h1>⚽ LEGEND MODE Soccer</h1>
<button onclick="startGame()">Play Match</button>
</div>

<div id="game" class="hidden">
<h2 id="scoreboard"></h2>
<canvas id="field" width="1000" height="600"></canvas>
</div>

<script>
let canvas=document.getElementById("field");
let ctx=canvas.getContext("2d");

let keys={};
document.addEventListener("keydown",e=>keys[e.key]=true);
document.addEventListener("keyup",e=>keys[e.key]=false);

let playerTeam=[];
let enemyTeam=[];
let controlledIndex=1;

let ball={x:500,y:300,vx:0,vy:0};
let score=0, enemyScore=0;
let timeLeft=60;
let frame=0;

let replay=false;
let replayFrames=[];
let replayIndex=0;

function startGame(){
document.getElementById("menu").classList.add("hidden");
document.getElementById("game").classList.remove("hidden");
createTeams();
timeLeft=60;
score=0;enemyScore=0;
frame=0;
gameLoop();
}

function createTeams(){
playerTeam=[];
enemyTeam=[];
for(let i=0;i<5;i++){
playerTeam.push({x:200,y:100+i*100,stamina:100,gk:i==0});
enemyTeam.push({x:800,y:100+i*100,gk:i==0});
}
}

function gameLoop(){
ctx.clearRect(0,0,1000,600);

drawStadium();

if(!replay){
updateMatch();
saveReplayFrame();
}else{
playReplay();
}

drawField();
drawTeams();
drawBall();

document.getElementById("scoreboard").innerText=
"YOU "+score+" - "+enemyScore+" | Time: "+timeLeft;

if(frame%60==0 && timeLeft>0 && !replay) timeLeft--;

frame++;
if(timeLeft<=0 && !replay) return;

requestAnimationFrame(gameLoop);
}

function updateMatch(){
updatePlayer();
smartAI(enemyTeam,false);
smartAI(playerTeam,true);
updateBall();
}

function updatePlayer(){
let p=playerTeam[controlledIndex];
let speed=2*(p.stamina/100);

if(keys["Shift"] && p.stamina>20){
speed*=2;
p.stamina-=0.5;
}

if(keys["w"])p.y-=speed;
if(keys["s"])p.y+=speed;
if(keys["a"])p.x-=speed;
if(keys["d"])p.x+=speed;

if(keys[" "]){
ball.vx=8;
ball.vy=(Math.random()*4-2);
}

if(p.stamina>0 && (keys["w"]||keys["a"]||keys["s"]||keys["d"])) p.stamina-=0.1;
if(p.stamina<100) p.stamina+=0.05;

if(distance(p,ball)<18){
ball.vx=6;
ball.vy=(Math.random()*4-2);
}
}

function smartAI(team,isAlly){
team.forEach((p,i)=>{
if(p.gk){
goalkeeperLogic(p,isAlly);
return;
}
let targetX=isAlly?ball.x-100:ball.x+100;
let targetY=ball.y;

p.x+=(targetX-p.x)*0.02;
p.y+=(targetY-p.y)*0.02;

if(distance(p,ball)<18){
ball.vx=isAlly?6:-6;
ball.vy=(Math.random()*4-2);
}
});
}

function goalkeeperLogic(gk,isAlly){
let goalX=isAlly?0:1000;
gk.y+=(ball.y-gk.y)*0.05;

if(Math.abs(ball.x-goalX)<100){
gk.x+=(goalX-gk.x)*0.1;
if(distance(gk,ball)<25){
ball.vx*=-1.5; // dive save
}
}
}

function updateBall(){
ball.x+=ball.vx;
ball.y+=ball.vy;
ball.vx*=0.99;

if(ball.x<0){enemyScore++;triggerReplay();}
if(ball.x>1000){score++;triggerReplay();}
if(ball.y<0||ball.y>600) ball.vy*=-1;
}

function triggerReplay(){
replay=true;
replayIndex=0;
}

function saveReplayFrame(){
replayFrames.push(JSON.stringify({
ball:{...ball},
playerTeam:JSON.parse(JSON.stringify(playerTeam)),
enemyTeam:JSON.parse(JSON.stringify(enemyTeam))
}));
if(replayFrames.length>300) replayFrames.shift();
}

function playReplay(){
if(replayIndex>=replayFrames.length){
replay=false;
resetBall();
return;
}
let frameData=JSON.parse(replayFrames[replayIndex]);
ball=frameData.ball;
playerTeam=frameData.playerTeam;
enemyTeam=frameData.enemyTeam;
replayIndex++;
}

function resetBall(){
ball={x:500,y:300,vx:0,vy:0};
}

function drawField(){
ctx.strokeStyle="white";
ctx.strokeRect(0,0,1000,600);
ctx.beginPath();
ctx.moveTo(500,0);
ctx.lineTo(500,600);
ctx.stroke();
}

function drawStadium(){
ctx.fillStyle="#1f7a1f";
ctx.fillRect(0,0,1000,600);
ctx.fillStyle="#444";
ctx.fillRect(0,0,1000,50);
ctx.fillRect(0,550,1000,50);
for(let i=0;i<200;i++){
ctx.fillStyle=["red","blue","yellow","white"][Math.floor(Math.random()*4)];
ctx.fillRect(Math.random()*1000,Math.random()*50,3,3);
ctx.fillRect(Math.random()*1000,550+Math.random()*50,3,3);
}
}

function drawTeams(){
playerTeam.forEach(p=>{
ctx.fillStyle=p.gk?"yellow":"blue";
ctx.beginPath();
ctx.arc(p.x,p.y,15,0,Math.PI*2);
ctx.fill();
});
enemyTeam.forEach(p=>{
ctx.fillStyle=p.gk?"orange":"red";
ctx.beginPath();
ctx.arc(p.x,p.y,15,0,Math.PI*2);
ctx.fill();
});
}

function drawBall(){
ctx.fillStyle="white";
ctx.beginPath();
ctx.arc(ball.x,ball.y,8,0,Math.PI*2);
ctx.fill();
}

function distance(a,b){
return Math.hypot(a.x-b.x,a.y-b.y);
}
</script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Soccer Career Manager</title>
<style>
body{
    font-family: Arial;
    background: linear-gradient(to right,#1e3c72,#2a5298);
    color:white;
    text-align:center;
}
button{
    padding:10px 20px;
    margin:5px;
    border:none;
    border-radius:5px;
    cursor:pointer;
    font-weight:bold;
}
.menu{margin-top:100px;}
.card{
    background:rgba(255,255,255,0.1);
    padding:10px;
    margin:10px;
    border-radius:10px;
}
.player{
    background:rgba(0,0,0,0.4);
    margin:5px;
    padding:5px;
    border-radius:5px;
}
.hidden{display:none;}
</style>
</head>
<body>

<div id="mainMenu" class="menu">
    <h1>⚽ Soccer Career Manager</h1>
    <button onclick="showCareer()">Start Career</button>
    <button onclick="showHowTo()">How To Play</button>
</div>

<div id="howTo" class="hidden">
    <h2>How To Play</h2>
    <p>You start with 10 Million.</p>
    <p>Buy players from the market.</p>
    <p>Players have random names and ratings.</p>
    <p>Higher rating = better match performance.</p>
    <p>Play matches to earn money.</p>
    <p>Sell players anytime.</p>
    <button onclick="backToMenu()">Back</button>
</div>

<div id="career" class="hidden">
    <h2>Career Mode</h2>
    <h3 id="moneyDisplay"></h3>
    <button onclick="generateMarket()">Refresh Market</button>
    <button onclick="playMatch()">Play Match</button>
    <button onclick="backToMenu()">Main Menu</button>

    <div class="card">
        <h3>Transfer Market</h3>
        <div id="market"></div>
    </div>

    <div class="card">
        <h3>Your Team</h3>
        <div id="team"></div>
    </div>
</div>

<script>
let money = 10000000;
let team = [];
let market = [];

const firstNames = ["Liam","Noah","Oliver","Elijah","James","Lucas","Mason","Ethan","Leo","Mateo"];
const lastNames = ["Smith","Garcia","Martinez","Brown","Lopez","Wilson","Anderson","Thomas","Taylor","Moore"];

function randomName(){
    return firstNames[Math.floor(Math.random()*firstNames.length)] + " " +
           lastNames[Math.floor(Math.random()*lastNames.length)];
}

function randomRating(){
    return Math.floor(Math.random()*40)+60; // 60-99
}

function playerPrice(rating){
    return rating * 100000; // price based on rating
}

function updateMoney(){
    document.getElementById("moneyDisplay").innerText = 
        "Budget: $" + (money/1000000).toFixed(2) + "M";
}

function showCareer(){
    document.getElementById("mainMenu").classList.add("hidden");
    document.getElementById("career").classList.remove("hidden");
    updateMoney();
    generateMarket();
    renderTeam();
}

function showHowTo(){
    document.getElementById("mainMenu").classList.add("hidden");
    document.getElementById("howTo").classList.remove("hidden");
}

function backToMenu(){
    document.getElementById("career").classList.add("hidden");
    document.getElementById("howTo").classList.add("hidden");
    document.getElementById("mainMenu").classList.remove("hidden");
}

function generateMarket(){
    market = [];
    for(let i=0;i<5;i++){
        let rating = randomRating();
        market.push({
            name: randomName(),
            rating: rating,
            price: playerPrice(rating)
        });
    }
    renderMarket();
}

function renderMarket(){
    let div = document.getElementById("market");
    div.innerHTML="";
    market.forEach((p,index)=>{
        div.innerHTML += `
        <div class="player">
            ${p.name} | Rating: ${p.rating} | Price: $${(p.price/1000000).toFixed(2)}M
            <button onclick="buyPlayer(${index})">Buy</button>
        </div>`;
    });
}

function renderTeam(){
    let div = document.getElementById("team");
    div.innerHTML="";
    if(team.length==0){
        div.innerHTML="No players yet.";
        return;
    }
    team.forEach((p,index)=>{
        div.innerHTML += `
        <div class="player">
            ${p.name} | Rating: ${p.rating}
            <button onclick="sellPlayer(${index})">Sell</button>
        </div>`;
    });
}

function buyPlayer(index){
    let p = market[index];
    if(money >= p.price){
        money -= p.price;
        team.push(p);
        market.splice(index,1);
        updateMoney();
        renderMarket();
        renderTeam();
    }else{
        alert("Not enough money!");
    }
}

function sellPlayer(index){
    let p = team[index];
    let sellPrice = Math.floor(p.price * 0.7);
    money += sellPrice;
    team.splice(index,1);
    updateMoney();
    renderTeam();
}

function playMatch(){
    if(team.length==0){
        alert("You need players!");
        return;
    }
    let avgRating = team.reduce((sum,p)=>sum+p.rating,0)/team.length;
    let result = Math.random()*100;

    if(result < avgRating){
        let reward = Math.floor(avgRating * 50000);
        money += reward;
        alert("You Won! Earned $" + (reward/1000000).toFixed(2)+"M");
    }else{
        alert("You Lost!");
    }
    updateMoney();
}
</script>

</body>
</html>

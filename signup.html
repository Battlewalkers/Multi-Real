<!DOCTYPE html>
<html>
<head>
<title>Sign Up - Multi</title>
<style>
body {
  font-family:'Comic Sans MS', cursive;
  background: linear-gradient(135deg, #F9E492 0%, #A7D129 100%);
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  margin:0;
}

.box {
  background:white;
  padding:40px;
  border-radius:20px;
  width:300px;
  box-shadow:0 5px 20px rgba(0,0,0,0.2);
  text-align:center;
  border: 3px solid #A7D129;
}

input {
  width:100%;
  padding:10px;
  margin:10px 0;
  border-radius:10px;
  border:2px solid #F9E492;
  font-size:16px;
}

input:focus {
  outline: none;
  border-color: #A7D129;
  box-shadow: 0 0 5px rgba(167, 209, 41, 0.3);
}

button {
  background:#A7D129;
  color:white;
  border:none;
  padding:12px;
  width:100%;
  border-radius:12px;
  font-size:16px;
  cursor:pointer;
  font-weight:bold;
  transition: background 0.3s ease;
}

button:hover {
  background: #8AB229;
}

a { 
  color:#F9E492; 
  text-decoration:none; 
  font-weight:bold;
}

h2 {
  color: #A7D129;
  margin-bottom: 20px;
}

.age-group {
  display: none;
}

.parent-email {
  display: none;
}

.error {
  color: #FF4444;
  font-size: 14px;
  margin-top: 10px;
  display: none;
}
</style>
</head>

<body>

<div class="box">
  <h2>✏️ Sign Up</h2>
  
  <select id="ageGroup" class="age-group">
    <option value="">Select your age group</option>
    <option value="13plus">13 or older</option>
    <option value="under13">Under 13</option>
  </select>
  
  <input type="text" id="parentEmail" class="parent-email" placeholder="Parent/Guardian Email">
  
  <input type="text" id="fullName" placeholder="Full Name">
  <input type="email" id="email" placeholder="Email">
  <input type="password" id="password" placeholder="Password">
  <input type="password" id="confirmPassword" placeholder="Confirm Password">
  
  <button onclick="validateForm()">Sign Up</button>
  <p id="errorMessage" class="error"></p>
  
  <p>Already have an account? <a href="login.html">Login</a></p>
</div>

<script>
function validateForm() {
  const ageGroup = document.getElementById('ageGroup');
  const parentEmail = document.getElementById('parentEmail');
  const fullName = document.getElementById('fullName');
  const email = document.getElementById('email');
  const password = document.getElementById('password');
  const confirmPassword = document.getElementById('confirmPassword');
  const errorMessage = document.getElementById('errorMessage');
  
  errorMessage.style.display = 'none';
  
  if (!ageGroup.value) {
    errorMessage.textContent = 'Please select your age group';
    errorMessage.style.display = 'block';
    return;
  }
  
  if (ageGroup.value === 'under13') {
    if (!parentEmail.value || !isValidEmail(parentEmail.value)) {
      errorMessage.textContent = 'Please enter a valid parent/guardian email';
      errorMessage.style.display = 'block';
      return;
    }
  }
  
  if (!fullName.value) {
    errorMessage.textContent = 'Please enter your full name';
    errorMessage.style.display = 'block';
    return;
  }
  
  if (!email.value || !isValidEmail(email.value)) {
    errorMessage.textContent = 'Please enter a valid email address';
    errorMessage.style.display = 'block';
    return;
  }
  
  if (!password.value) {
    errorMessage.textContent = 'Please enter a password';
    errorMessage.style.display = 'block';
    return;
  }
  
  if (password.value !== confirmPassword.value) {
    errorMessage.textContent = 'Passwords do not match';
    errorMessage.style.display = 'block';
    return;
  }
  
  // All validation passed
  alert('Form submitted successfully!');
  // Here you would typically submit the form data to your server
}

function isValidEmail(email) {
  const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
  return emailRegex.test(email);
}

document.getElementById('ageGroup').addEventListener('change', function() {
  const parentEmailField = document.getElementById('parentEmail');
  
  if (this.value === 'under13') {
    parentEmailField.style.display = 'block';
    parentEmailField.required = true;
  } else {
    parentEmailField.style.display = 'none';
    parentEmailField.required = false;
  }
});
</script>

</body>
</html>

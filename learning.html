<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Multi — Learn</title>

<style>
* { box-sizing: border-box; margin:0; padding:0; }

body {
  font-family: 'Comic Sans MS', cursive, sans-serif;
  background:#f5f5f5;
  color:#333;
}

header {
  position: fixed;
  top:0;
  width:100%;
  background:#4CAF50;
  color:white;
  padding:15px 30px;
  display:flex;
  justify-content: space-between;
  align-items:center;
  z-index:1000;
}

header .logo {
  font-size:24px;
  font-weight:bold;
}

header button {
  background:white;
  color:#4CAF50;
  border:none;
  padding:8px 15px;
  border-radius:10px;
  font-weight:bold;
  cursor:pointer;
}

main {
  padding:120px 20px 40px;
  max-width:1200px;
  margin:auto;
}

h1 {
  text-align:center;
  margin-bottom:25px;
}

.section-title {
  font-size:22px;
  margin:30px 0 15px;
}

.grid {
  display:grid;
  grid-template-columns: repeat(auto-fit, minmax(220px,1fr));
  gap:20px;
}

.card {
  background:white;
  padding:20px;
  border-radius:15px;
  box-shadow:0 5px 10px rgba(0,0,0,0.15);
  cursor:pointer;
  transition:0.2s;
}

.card:hover {
  transform: translateY(-5px);
}

.card h3 {
  margin-bottom:10px;
  color:#2196F3;
}

.badge {
  display:inline-block;
  background:#FFD700;
  padding:5px 10px;
  border-radius:10px;
  font-weight:bold;
  font-size:14px;
}

.hidden {
  display:none;
}
</style>
</head>

<body>

<header>
  <div class="logo">Multi Learn</div>
  <button onclick="goHome()">Home</button>
</header>

<main>

  <h1>📚 Learning on Multi</h1>

  <!-- Grades -->
  <div class="section-title">Choose a Grade</div>
  <div class="grid" id="gradeGrid"></div>

  <!-- Subjects -->
  <div class="section-title hidden" id="subjectTitle">Choose a Subject</div>
  <div class="grid hidden" id="subjectGrid"></div>

  <!-- Units -->
  <div class="section-title hidden" id="unitTitle">Units & Lessons</div>
  <div class="grid hidden" id="unitGrid"></div>

</main>

<script>
/* ===== SIMPLE DATA (easy to expand) ===== */

const grades = [
  "Kindergarten","1st Grade","2nd Grade","3rd Grade","4th Grade","5th Grade",
  "6th Grade","7th Grade","8th Grade","9th Grade","10th Grade","11th Grade","12th Grade"
];

const subjects = ["Math","Language Arts","Science"];

const units = {
  Math: ["Numbers", "Addition & Subtraction", "Multiplication", "Fractions", "Algebra"],
  "Language Arts": ["Reading", "Grammar", "Writing", "Vocabulary"],
  Science: ["Life Science", "Earth Science", "Physics", "Chemistry"]
};

/* ===== STATE (what the student picked) ===== */

let selectedGrade = null;
let selectedSubject = null;

/* ===== ELEMENTS ===== */

const gradeGrid = document.getElementById("gradeGrid");
const subjectGrid = document.getElementById("subjectGrid");
const unitGrid = document.getElementById("unitGrid");

const subjectTitle = document.getElementById("subjectTitle");
const unitTitle = document.getElementById("unitTitle");

/* ===== LOAD GRADES ===== */

grades.forEach(grade => {
  const card = document.createElement("div");
  card.className = "card";
  card.innerHTML = `<h3>${grade}</h3><span class="badge">Select</span>`;
  card.onclick = () => selectGrade(grade);
  gradeGrid.appendChild(card);
});

/* ===== FUNCTIONS ===== */

function selectGrade(grade) {
  selectedGrade = grade;
  subjectGrid.innerHTML = "";
  subjectTitle.classList.remove("hidden");
  subjectGrid.classList.remove("hidden");
  unitGrid.classList.add("hidden");
  unitTitle.classList.add("hidden");

  subjects.forEach(subject => {
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `<h3>${subject}</h3><p>${grade}</p>`;
    card.onclick = () => selectSubject(subject);
    subjectGrid.appendChild(card);
  });
}

function selectSubject(subject) {
  selectedSubject = subject;
  unitGrid.innerHTML = "";
  unitTitle.classList.remove("hidden");
  unitGrid.classList.remove("hidden");

  units[subject].forEach(unit => {
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `
      <h3>${unit}</h3>
      <p>${selectedGrade} ${selectedSubject}</p>
      <span class="badge">Start</span>
    `;
    card.onclick = () => {
      alert(
        selectedGrade + " → " +
        selectedSubject + " → " +
        unit + "\n\nLesson system opens here."
      );
    };
    unitGrid.appendChild(card);
  });
}

function goHome() {
  window.location.href = "index.html";
}
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Multi — Grade 1 Math</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  font-family: 'Comic Sans MS', cursive;
  background: #f2f2f2;
  margin: 0;
  padding-top: 80px;
}

header {
  position: fixed;
  top: 0;
  width: 100%;
  background: #4CAF50;
  color: white;
  padding: 20px 40px;
  display: flex;
  justify-content: space-between;
  font-size: 20px;
}

.container {
  max-width: 1000px;
  margin: auto;
  padding: 30px;
}

.card {
  background: white;
  border-radius: 20px;
  padding: 35px;
  margin-bottom: 30px;
  box-shadow: 0 6px 18px rgba(0,0,0,0.25);
}

.hidden { display: none; }

button {
  padding: 12px 25px;
  border: none;
  border-radius: 12px;
  background: #4CAF50;
  color: white;
  font-size: 16px;
  cursor: pointer;
  margin-top: 10px;
}

.question {
  margin: 10px 0;
}

input {
  width: 70px;
  font-size: 16px;
  padding: 5px;
}
</style>
</head>

<body>

<header>
  <div><strong>Multi</strong> — Grade 1 Math</div>
  <button onclick="location.href='index.html'">← Home</button>
</header>

<div class="container">

<!-- UNIT -->
<div class="card" id="unit">
  <h2>📘 Unit 1: Adding Numbers (1–10)</h2>
  <p>Complete all 5 lessons to unlock Math Quest.</p>
  <button onclick="startLesson()">Start Lesson 1</button>
</div>

<!-- LESSON CARD -->
<div class="card hidden" id="lessonCard">
  <h2 id="lessonTitle"></h2>
  <p id="lessonText"></p>

  <div id="questions"></div>

  <button onclick="submitLesson()">Submit Lesson</button>
  <p id="lessonMsg" style="font-weight:bold;"></p>
</div>

<!-- UNLOCK RPG -->
<div class="card hidden" id="unlock">
  <h2>🎉 Unit Complete!</h2>
  <p>You unlocked <strong>Math Quest RPG</strong>.</p>
  <button onclick="startGame()">Enter Math Quest</button>
</div>

<!-- RPG -->
<div class="card hidden" id="game">
  <h2>🐉 Math Quest RPG</h2>

  <p>
    Level: <span id="level">1</span> |
    HP: <span id="hp">10</span> |
    Coins: <span id="coins">0</span>
  </p>

  <p>
    Enemy: <strong><span id="enemyName"></span></strong>
    (HP: <span id="enemyHp"></span>)
  </p>

  <p><strong>Quest:</strong> <span id="quest"></span></p>

  <p>Solve: <strong><span id="question"></span></strong></p>

  <input type="number" id="answer">

  <div>
    <button onclick="attack('normal')">⚔️ Quick Strike</button>
    <button onclick="attack('power')">🔥 Power Blast</button>
  </div>

  <p id="log" style="font-weight:bold;"></p>
</div>

</div>

<script>
/* ---------- LESSON DATA ---------- */
const lessons = [
  { title:"Lesson 1: What is Adding?",
    text:"Adding means putting numbers together.",
    answers:[2,3,4,5,6]
  },
  { title:"Lesson 2: Small Numbers",
    text:"We add numbers to find totals.",
    answers:[3,4,5,6,7]
  },
  { title:"Lesson 3: Practice",
    text:"Practice makes you better at math.",
    answers:[4,5,6,7,8]
  },
  { title:"Lesson 4: Counting On",
    text:"Counting on helps you add faster.",
    answers:[5,6,7,8,9]
  },
  { title:"Lesson 5: Review",
    text:"You are ready for Math Quest!",
    answers:[6,7,8,9,10]
  }
];

let lessonIndex = 0;

/* ---------- LESSON SYSTEM ---------- */
function startLesson() {
  unit.classList.add("hidden");
  lessonCard.classList.remove("hidden");
  loadLesson();
}

function loadLesson() {
  const lesson = lessons[lessonIndex];
  lessonTitle.textContent = lesson.title;
  lessonText.textContent = lesson.text;
  questions.innerHTML = "";

  for (let i = 0; i < 5; i++) {
    questions.innerHTML += `
      <div class="question">
        ${i+1}) ${i+1} + ${lessonIndex+1} =
        <input type="number">
      </div>`;
  }
}

function submitLesson() {
  const inputs = document.querySelectorAll("#questions input");
  const correct = lessons[lessonIndex].answers;

  for (let i = 0; i < 5; i++) {
    if (Number(inputs[i].value) !== correct[i]) {
      lessonMsg.textContent = "❌ Some answers are wrong.";
      return;
    }
  }

  lessonIndex++;
  lessonMsg.textContent = "✅ Lesson complete!";

  if (lessonIndex >= lessons.length) {
    lessonCard.classList.add("hidden");
    unlock.classList.remove("hidden");
  } else {
    loadLesson();
  }
}

/* ---------- RPG SYSTEM ---------- */
let player = { level:1, hp:10, coins:0 };
let enemy = {};
let correctAnswer = 0;

const enemies = [
  { name:"Slime", hp:8 },
  { name:"Goblin", hp:12 },
  { name:"Dragon", hp:18 }
];

const quests = [
  "Save the village!",
  "Defeat the forest monster!",
  "Protect the castle!"
];

function startGame() {
  unlock.classList.add("hidden");
  game.classList.remove("hidden");
  newEnemy();
  newQuestion("normal");
  updateUI();
}

function newEnemy() {
  enemy = {...enemies[Math.floor(Math.random()*enemies.length)]};
  enemyName.textContent = enemy.name;
  enemyHp.textContent = enemy.hp;
  quest.textContent = quests[Math.floor(Math.random()*quests.length)];
}

function newQuestion(type) {
  let a = Math.floor(Math.random()*5)+1;
  let b = Math.floor(Math.random()*5)+1;
  if (type === "power") b += 5;
  correctAnswer = a + b;
  question.textContent = `${a} + ${b}`;
}

function updateUI() {
  level.textContent = player.level;
  hp.textContent = player.hp;
  coins.textContent = player.coins;
  enemyHp.textContent = enemy.hp;
}

function attack(type) {
  const val = Number(answer.value);
  answer.value = "";

  if (val === correctAnswer) {
    let dmg = type === "power" ? 4 : 2;
    enemy.hp -= dmg;
    log.textContent = type === "power"
      ? "🔥 Power Blast hit!"
      : "⚔️ Quick Strike hit!";
  } else {
    player.hp--;
    log.textContent = "❌ Miss!";
  }

  if (enemy.hp <= 0) {
    player.level++;
    player.coins += 5;
    log.textContent = "🎉 Enemy defeated! Quest complete!";
    newEnemy();
  }

  if (player.hp <= 0) {
    alert("Game Over! Try again.");
    location.reload();
  }

  newQuestion(type);
  updateUI();
}
</script>

</body>
</html>

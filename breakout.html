<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Breakout Ultra</title>
<style>
body{
    margin:0;
    display:flex;
    font-family:Arial;
}
#menu{
    width:260px;
    background:#111;
    color:white;
    padding:15px;
}
#menu h2{margin-top:0;}
#gameContainer{
    flex:1;
    display:flex;
    justify-content:center;
    align-items:center;
    position:relative;
    overflow:hidden;
}
canvas{
    border:4px solid white;
}
button{
    padding:10px 20px;
    font-size:16px;
    cursor:pointer;
}
#startScreen{
    position:absolute;
    background:rgba(0,0,0,0.8);
    color:white;
    width:100%;
    height:100%;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
}
</style>
</head>
<body>

<div id="menu">
<h2>🧱 Breakout Ultra</h2>
<p><b>How To Play</b></p>
<p>← → or touch sides</p>
<p>Break all bricks</p>
<hr>
<p><b>Power-Ups</b></p>
<p>🧨 Multi-ball – Spawn extra balls</p>
<p>📏 Expand – Paddle gets wider</p>
<p>🐢 Slow – Slows balls</p>
<p>❤️ Extra Life – +1 life</p>
<p>⚡ Speed – Faster ball</p>
<p id="stats"></p>
</div>

<div id="gameContainer">
<canvas id="game" width="800" height="500"></canvas>
<div id="startScreen">
<h1>Breakout Ultra</h1>
<button onclick="startGame()">Start Game</button>
</div>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let level=1, score=0, lives=3;
let gameRunning=false;
let balls=[];
let paddleWidth=110, paddleHeight=12, paddleX=350;
let right=false,left=false;
let bricks=[], rows=5, cols=8;
let powerUps=[];
let gradientOffset=0;

// Controls
document.addEventListener("keydown",e=>{
if(e.key==="ArrowRight") right=true;
if(e.key==="ArrowLeft") left=true;
});
document.addEventListener("keyup",e=>{
if(e.key==="ArrowRight") right=false;
if(e.key==="ArrowLeft") left=false;
});

// Start
function startGame(){
document.getElementById("startScreen").style.display="none";
gameRunning=true;
resetLevel();
}

// Reset level
function resetLevel(){
balls=[createBall()];
rows=4+level;
createBricks();
}

// Ball
function createBall(){
return {
x:400,
y:450,
dx:4+(level*0.3),
dy:-4-(level*0.3),
radius:8
};
}

// Bricks
function createBricks(){
bricks=[];
for(let c=0;c<cols;c++){
bricks[c]=[];
for(let r=0;r<rows;r++){
let type="normal";
let hits=1;

if(level%5===0 && r===0 && c===3){
type="boss";
hits=20;
}
else if(r%3===0){
type="ice";
hits=2;
}
bricks[c][r]={x:0,y:0,hits:hits,type:type,lastHit:0};
}
}
}

// Draw animated gradient
function drawBackground(){
gradientOffset+=0.01;
let grad=ctx.createLinearGradient(0,0,800,500);
grad.addColorStop(0,"hsl("+ (gradientOffset*100)%360 +",70%,50%)");
grad.addColorStop(1,"hsl("+ ((gradientOffset*100)+100)%360 +",70%,40%)");
ctx.fillStyle=grad;
ctx.fillRect(0,0,800,500);
}

// Draw balls
function drawBalls(){
balls.forEach(ball=>{
ctx.beginPath();
ctx.arc(ball.x,ball.y,ball.radius,0,Math.PI*2);
ctx.fillStyle="white";
ctx.fill();
});
}

// Draw paddle
function drawPaddle(){
ctx.fillStyle="white";
ctx.fillRect(paddleX,480,paddleWidth,paddleHeight);
}

// Draw bricks
function drawBricks(){
for(let c=0;c<cols;c++){
for(let r=0;r<rows;r++){
let b=bricks[c][r];
if(b.hits>0){
let bx=c*90+35;
let by=r*30+50;
b.x=bx; b.y=by;

if(b.type==="boss") ctx.fillStyle="purple";
else if(b.type==="ice") ctx.fillStyle="cyan";
else ctx.fillStyle="green";

ctx.fillRect(bx,by,75,20);
}
}
}
}

// Collision
function collision(){
balls.forEach(ball=>{
for(let c=0;c<cols;c++){
for(let r=0;r<rows;r++){
let b=bricks[c][r];
if(b.hits>0){
if(ball.x>b.x && ball.x<b.x+75 &&
ball.y>b.y && ball.y<b.y+20){

// Ice logic (must hit twice quickly)
if(b.type==="ice"){
let now=Date.now();
if(now-b.lastHit<1000){
b.hits--;
}
b.lastHit=now;
}else{
b.hits--;
}

ball.dy*=-1;
score+=10;

if(Math.random()<0.2) spawnPowerUp(b.x+30,b.y);

if(allCleared()) nextLevel();
}
}
}
}
});
}

function allCleared(){
for(let c=0;c<cols;c++)
for(let r=0;r<rows;r++)
if(bricks[c][r].hits>0) return false;
return true;
}

function nextLevel(){
level++;
resetLevel();
}

// Powerups
function spawnPowerUp(x,y){
let types=["multi","expand","slow","life","speed"];
powerUps.push({x:x,y:y,type:types[Math.floor(Math.random()*types.length)]});
}

function drawPowerUps(){
powerUps.forEach((p,i)=>{
p.y+=3;
ctx.fillStyle="yellow";
ctx.fillRect(p.x,p.y,20,20);

if(p.y>480 && p.x>paddleX && p.x<paddleX+paddleWidth){
applyPower(p.type);
powerUps.splice(i,1);
}
});
}

function applyPower(type){
if(type==="multi"){
balls.push(createBall());
}
if(type==="expand"){
paddleWidth+=30;
}
if(type==="slow"){
balls.forEach(b=>{b.dx*=0.7;b.dy*=0.7;});
}
if(type==="life"){
lives++;
}
if(type==="speed"){
balls.forEach(b=>{b.dx*=1.3;b.dy*=1.3;});
}
}

// Update
function update(){
if(!gameRunning) return;

drawBackground();
drawBricks();
drawBalls();
drawPaddle();
drawPowerUps();

document.getElementById("stats").innerHTML=
"Score: "+score+"<br>Lives: "+lives+"<br>Level: "+level;

balls.forEach((ball,i)=>{
ball.x+=ball.dx;
ball.y+=ball.dy;

// Wall bounce
if(ball.x<8||ball.x>792) ball.dx*=-1;
if(ball.y<8) ball.dy*=-1;

// Paddle bounce
if(ball.y>480 && ball.x>paddleX && ball.x<paddleX+paddleWidth){
ball.dy*=-1;
}

// Lose ball
if(ball.y>500){
balls.splice(i,1);
if(balls.length===0){
lives--;
if(lives<=0){
alert("Game Over!");
location.reload();
}else{
balls=[createBall()];
}
}
}
});

// Paddle movement
if(right && paddleX<690) paddleX+=7;
if(left && paddleX>0) paddleX-=7;

// Speed increase over time
balls.forEach(b=>{
b.dx*=1.0005;
b.dy*=1.0005;
});

collision();
requestAnimationFrame(update);
}

update();
</script>
</body>
</html>

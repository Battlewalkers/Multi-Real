<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess Game - Yellow & Green Theme</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #FFD700 0%, #ADFF2F 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            color: #006400;
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 30px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
            color: #006400;
        }

        .game-container {
            background: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            max-width: 1000px;
            width: 100%;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h2 {
            font-size: 1.8em;
            margin-bottom: 15px;
        }

        .board-container {
            position: relative;
            margin: 0 auto;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #chessBoard {
            border: 4px solid #006400;
            border-radius: 10px;
            background: #ADFF2F;
            position: relative;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .square {
            width: 80px;
            height: 80px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            cursor: pointer;
            transition: all 0.3s;
        }

        .square.light {
            background: #90EE90;
        }

        .square.dark {
            background: #006400;
        }

        .square:hover {
            background: #FFD700;
        }

        .square.selected {
            background: #FFD700 !important;
            box-shadow: inset 0 0 10px rgba(255, 215, 0, 0.5);
        }

        .square.valid-move {
            background: rgba(255, 215, 0, 0.5) !important;
        }

        .square.valid-capture {
            background: rgba(255, 0, 0, 0.5) !important;
        }

        .piece {
            width: 60px;
            height: 60px;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            transition: transform 0.2s;
        }

        .piece:hover {
            transform: scale(1.1);
        }

        .piece.selected {
            transform: scale(1.2);
        }

        .captured-pieces {
            display: flex;
            justify-content: center;
            margin: 20px 0;
            gap: 10px;
        }

        .captured-pieces .piece {
            width: 40px;
            height: 40px;
            opacity: 0.8;
        }

        .game-controls {
            background: rgba(0, 100, 0, 0.1);
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
            text-align: center;
        }

        .game-controls button {
            background: #006400;
            color: white;
            border: none;
            padding: 12px 25px;
            margin: 5px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s;
            min-width: 120px;
        }

        .game-controls button:hover {
            background: #004d00;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }

        .game-status {
            background: rgba(255, 215, 0, 0.3);
            border: 2px solid #FFD700;
            padding: 15px;
            border-radius: 10px;
            margin: 15px 0;
            text-align: center;
            font-size: 18px;
            font-weight: 600;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background-color: white;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            max-width: 400px;
            width: 90%;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .modal h3 {
            color: #006400;
            margin-bottom: 20px;
        }

        .modal button {
            background: #006400;
            color: white;
            border: none;
            padding: 12px 25px;
            margin: 5px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        .modal button:hover {
            background: #004d00;
        }

        .promotion-modal {
            display: none;
            position: fixed;
            z-index: 1001;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            align-items: center;
            justify-content: center;
        }

        .promotion-content {
            background-color: #90EE90;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            max-width: 300px;
            width: 90%;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .promotion-content h4 {
            color: #006400;
            margin-bottom: 15px;
        }

        .promotion-options {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 15px;
        }

        .promotion-option {
            width: 50px;
            height: 50px;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            cursor: pointer;
            border: 3px solid #006400;
            border-radius: 5px;
        }

        .promotion-option:hover {
            border-color: #FFD700;
            transform: scale(1.1);
        }

        .promotion-option.selected {
            border-color: #FFD700;
            background-color: rgba(255, 215, 0, 0.3);
        }

        .loading-overlay {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.8);
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .loading-text {
            color: #006400;
            font-weight: 600;
            font-size: 18px;
        }

        .ai-thinking {
            display: none;
            background: rgba(255, 255, 255, 0.9);
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            margin-top: 10px;
        }

        .ai-thinking img {
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <h1>Chess Game</h1>
    
    <div class="game-container">
        <div class="header">
            <h2>Yellow & Green Chess</h2>
            <div class="game-status" id="gameStatus">White's Turn</div>
        </div>

        <div class="board-container">
            <div id="chessBoard"></div>
            <div class="loading-overlay" id="loadingOverlay">
                <div class="loading-text">Loading...</div>
            </div>
        </div>

        <div class="captured-pieces">
            <div id="whiteCaptured"></div>
            <div id="blackCaptured"></div>
        </div>

        <div class="game-controls">
            <button onclick="startNewGame()">New Game</button>
            <button onclick="showSettings()">Settings</button>
            <button onclick="showAbout()">About</button>
        </div>

        <div class="ai-thinking" id="aiThinking">
            <img src="data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMzAiIGhlaWdodD0iMzAiIHZpZXdCb3g9IjAgMCAzMCAzMCIgZmlsbD0ibm9uZSIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj4KPHBhdGggZD0iTTE1IDEwQzEwLjY1MDUgMTAgNyA4LjM1MDUgNyA0QzcgMC42NDk0ODUgMTAuNjUwNSAwIDE1IDBDMTkuMzQ5NSAwIDIzIDAuNjQ5NDg1IDIzIDRDMjMgOC4zNTA1IDE5LjM0OTUgMTAgMTUgMTBaIiBmaWxsPSJ3aGl0ZSIgc3Ryb2tlPSJibGFjayIgc3Ryb2tlLXdpZHRoPSIyIi8+Cjwvc3ZnPg==">
            AI Thinking...
        </div>
    </div>

    <div id="promotionModal" class="promotion-modal">
        <div class="promotion-content">
            <h4>Promote Pawn To:</h4>
            <div class="promotion-options">
                <div class="promotion-option" data-piece="queen"></div>
                <div class="promotion-option" data-piece="rook"></div>
                <div class="promotion-option" data-piece="bishop"></div>
                <div class="promotion-option" data-piece="knight"></div>
            </div>
            <button onclick="cancelPromotion()">Cancel</button>
        </div>
    </div>

    <div id="settingsModal" class="modal">
        <div class="modal-content">
            <h3>Settings</h3>
            <label><input type="checkbox" id="showLegalMoves"> Show Legal Moves</label><br>
            <label><input type="checkbox" id="showCoordinates"> Show Coordinates</label><br>
            <label><input type="radio" name="difficulty" value="easy"> Easy</label>
            <label><input type="radio" name="difficulty" value="medium"> Medium</label>
            <label><input type="radio" name="difficulty" value="hard"> Hard</label><br>
            <button onclick="closeModal()">Close</button>
        </div>
    </div>

    <div id="aboutModal" class="modal">
        <div class="modal-content">
            <h3>About</h3>
            <p>Yellow & Green Chess Game</p>
            <p>Created with HTML5, CSS3, and JavaScript</p>
            <button onclick="closeModal()">Close</button>
        </div>
    </div>

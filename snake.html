<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake</title>

<style>
:root {
    --bg-color: #0D1117;
    --card-color: #161B22;
    --border-color: #30363D;
    --snake-head: #22C55E;
    --snake-body: #3B82F6;
    --food-color: #EF4444;
    --text-color: #E6EDF3;
}

body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: var(--bg-color);
    font-family: Arial, sans-serif;
    color: var(--text-color);
}

#game-container {
    position: relative;
    background: var(--card-color);
    border: 1px solid var(--border-color);
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 10px 40px rgba(0,0,0,0.4);
}

.score-board {
    display: flex;
    justify-content: space-between;
    padding: 12px 18px;
    font-weight: bold;
    border-bottom: 1px solid var(--border-color);
}

canvas {
    display: block;
    width: 90vw;
    max-width: 600px;
    aspect-ratio: 1/1;
    background: #0B0F14;
}

.overlay {
    position: absolute;
    inset: 0;
    background: rgba(13,17,23,0.9);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
}

.hidden {
    display: none;
}

button {
    padding: 10px 24px;
    border-radius: 6px;
    border: none;
    background: var(--snake-body);
    color: white;
    font-weight: bold;
    cursor: pointer;
    margin-top: 15px;
}

button:hover {
    opacity: 0.8;
}
</style>
</head>

<body>

<div id="game-container">
    <div class="score-board">
        <div>Score: <span id="score">0</span></div>
        <div>High: <span id="highScore">0</span></div>
    </div>

    <canvas id="game"></canvas>

    <div id="startScreen" class="overlay">
        <h1>Snake</h1>
        <button onclick="startGame()">Start Game</button>
    </div>

    <div id="gameOverScreen" class="overlay hidden">
        <h1>Game Over</h1>
        <div>Final Score: <span id="finalScore">0</span></div>
        <button onclick="startGame()">Play Again</button>
    </div>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const GRID_SIZE = 20;
const TILE_COUNT = 30;

canvas.width = GRID_SIZE * TILE_COUNT;
canvas.height = GRID_SIZE * TILE_COUNT;

let snake;
let food;
let direction;
let score;
let highScore = localStorage.getItem("snakeHighScore") || 0;
let gameInterval;

document.getElementById("highScore").innerText = highScore;

function startGame() {
    document.getElementById("startScreen").classList.add("hidden");
    document.getElementById("gameOverScreen").classList.add("hidden");

    snake = [
        {x: 15, y: 15},
        {x: 14, y: 15},
        {x: 13, y: 15}
    ];

    direction = {x: 1, y: 0};
    score = 0;
    document.getElementById("score").innerText = score;

    spawnFood();

    clearInterval(gameInterval);
    gameInterval = setInterval(gameLoop, 100);
}

function spawnFood() {
    food = {
        x: Math.floor(Math.random() * TILE_COUNT),
        y: Math.floor(Math.random() * TILE_COUNT)
    };

    for (let part of snake) {
        if (part.x === food.x && part.y === food.y) {
            spawnFood();
        }
    }
}

function gameLoop() {
    update();
    draw();
}

function update() {
    const head = {
        x: snake[0].x + direction.x,
        y: snake[0].y + direction.y
    };

    // Wall collision
    if (
        head.x < 0 || head.x >= TILE_COUNT ||
        head.y < 0 || head.y >= TILE_COUNT
    ) {
        return gameOver();
    }

    // Self collision
    for (let part of snake) {
        if (head.x === part.x && head.y === part.y) {
            return gameOver();
        }
    }

    snake.unshift(head);

    // Eat food
    if (head.x === food.x && head.y === food.y) {
        score += 10;
        document.getElementById("score").innerText = score;

        if (score > highScore) {
            highScore = score;
            localStorage.setItem("snakeHighScore", highScore);
            document.getElementById("highScore").innerText = highScore;
        }

        spawnFood();
    } else {
        snake.pop();
    }
}

function gameOver() {
    clearInterval(gameInterval);
    document.getElementById("finalScore").innerText = score;
    document.getElementById("gameOverScreen").classList.remove("hidden");
}

function draw() {
    ctx.fillStyle = "#0B0F14";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Draw snake
    snake.forEach((part, index) => {
        ctx.fillStyle = index === 0 ? "#22C55E" : "#3B82F6";
        ctx.fillRect(
            part.x * GRID_SIZE,
            part.y * GRID_SIZE,
            GRID_SIZE - 2,
            GRID_SIZE - 2
        );
    });

    // Draw food
    ctx.fillStyle = "#EF4444";
    ctx.fillRect(
        food.x * GRID_SIZE,
        food.y * GRID_SIZE,
        GRID_SIZE - 2,
        GRID_SIZE - 2
    );
}

window.addEventListener("keydown", e => {
    if (e.key === "ArrowUp" && direction.y !== 1)
        direction = {x: 0, y: -1};

    if (e.key === "ArrowDown" && direction.y !== -1)
        direction = {x: 0, y: 1};

    if (e.key === "ArrowLeft" && direction.x !== 1)
        direction = {x: -1, y: 0};

    if (e.key === "ArrowRight" && direction.x !== -1)
        direction = {x: 1, y: 0};
});
</script>

</body>
</html>

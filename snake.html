<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake Game</title>

<style>
body {
  margin: 0;
  background: #f5f5f5;
  font-family: 'Comic Sans MS', cursive, sans-serif;
  text-align: center;
}

header {
  background: #4CAF50;
  color: white;
  padding: 20px;
  font-size: 28px;
}

footer {
  background: #4CAF50;
  color: white;
  padding: 15px;
  margin-top: 40px;
}

.game-container {
  background: #FFEB3B;
  margin: 40px auto;
  padding: 30px;
  border-radius: 20px;
  box-shadow: 0 5px 15px rgba(0,0,0,0.2);
  max-width: 650px;
}

.score-board {
  display: flex;
  justify-content: space-between;
  margin-bottom: 15px;
  font-weight: bold;
  font-size: 18px;
}

canvas {
  background: white;
  border-radius: 12px;
  display: block;
  margin: auto;
}

button {
  margin-top: 15px;
  padding: 10px 20px;
  background: #4CAF50;
  color: white;
  border: none;
  border-radius: 12px;
  cursor: pointer;
  font-size: 16px;
}

button:hover {
  background: #43a047;
}
</style>
</head>

<body>

<header>🐍 Snake Game</header>

<div class="game-container">

  <div class="score-board">
    <div>Score: <span id="score">0</span></div>
    <div>High: <span id="highScore">0</span></div>
  </div>

  <canvas id="game" width="600" height="600"></canvas>

  <div id="startScreen">
    <button onclick="startGame()">Start Game</button>
  </div>

  <div id="gameOverScreen" style="display:none;">
    <h2>Game Over!</h2>
    <p>Final Score: <span id="finalScore">0</span></p>
    <button onclick="startGame()">Play Again</button>
  </div>

</div>

<footer>© 2026 Multi</footer>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const GRID_SIZE = 20;
const TILE_COUNT = 30;

let snake;
let food;
let direction;
let score;
let highScore = localStorage.getItem("snakeHighScore") || 0;
let gameInterval;

document.getElementById("highScore").innerText = highScore;

function startGame() {
  document.getElementById("startScreen").style.display = "none";
  document.getElementById("gameOverScreen").style.display = "none";

  snake = [
    {x: 15, y: 15},
    {x: 14, y: 15},
    {x: 13, y: 15}
  ];

  direction = {x: 1, y: 0};
  score = 0;
  document.getElementById("score").innerText = score;

  spawnFood();

  clearInterval(gameInterval);
  gameInterval = setInterval(gameLoop, 100);
}

function spawnFood() {
  food = {
    x: Math.floor(Math.random() * TILE_COUNT),
    y: Math.floor(Math.random() * TILE_COUNT)
  };

  for (let part of snake) {
    if (part.x === food.x && part.y === food.y) {
      spawnFood();
    }
  }
}

function gameLoop() {
  update();
  draw();
}

function update() {
  const head = {
    x: snake[0].x + direction.x,
    y: snake[0].y + direction.y
  };

  if (
    head.x < 0 || head.x >= TILE_COUNT ||
    head.y < 0 || head.y >= TILE_COUNT
  ) {
    return gameOver();
  }

  for (let part of snake) {
    if (head.x === part.x && head.y === part.y) {
      return gameOver();
    }
  }

  snake.unshift(head);

  if (head.x === food.x && head.y === food.y) {
    score += 10;
    document.getElementById("score").innerText = score;

    if (score > highScore) {
      highScore = score;
      localStorage.setItem("snakeHighScore", highScore);
      document.getElementById("highScore").innerText = highScore;
    }

    spawnFood();
  } else {
    snake.pop();
  }
}

function gameOver() {
  clearInterval(gameInterval);
  document.getElementById("finalScore").innerText = score;
  document.getElementById("gameOverScreen").style.display = "block";
}

function draw() {
  ctx.fillStyle = "white";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  snake.forEach((part, index) => {
    ctx.fillStyle = index === 0 ? "#4CAF50" : "#66BB6A";
    ctx.fillRect(
      part.x * GRID_SIZE,
      part.y * GRID_SIZE,
      GRID_SIZE - 2,
      GRID_SIZE - 2
    );
  });

  ctx.fillStyle = "#f44336";
  ctx.fillRect(
    food.x * GRID_SIZE,
    food.y * GRID_SIZE,
    GRID_SIZE - 2,
    GRID_SIZE - 2
  );
}

window.addEventListener("keydown", e => {
  if (e.key === "ArrowUp" && direction.y !== 1)
    direction = {x: 0, y: -1};

  if (e.key === "ArrowDown" && direction.y !== -1)
    direction = {x: 0, y: 1};

  if (e.key === "ArrowLeft" && direction.x !== 1)
    direction = {x: -1, y: 0};

  if (e.key === "ArrowRight" && direction.x !== -1)
    direction = {x: 1, y: 0};
});
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Multi — Home</title>
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>

<header class="topbar">
  <div class="brand">Multi</div>
  <button id="signOutBtn">Sign Out</button>
</header>

<main class="container">
  <h2 id="welcome"></h2>

  <!-- Games Card -->
  <section class="card" style="cursor:pointer;" id="gamesCard">
    <h3>🎮 Gaming</h3>
    <p>Play games and have fun</p>
  </section>

  <!-- Learning Card -->
  <section class="card" style="cursor:pointer;" id="learningCard">
    <h3>📚 Learning</h3>
    <p>Interactive lessons and tutorials</p>
  </section>

  <!-- Shopping Card -->
  <section class="card">
    <h3>🛒 Shopping</h3>
    <p>Products and store links here.</p>
  </section>
</main>

<script src="assets/auth.js"></script>

<script>
  // Check session
  const session = getSession();
  if (!session) {
    window.location.href = 'index.html';
  } else {
    document.getElementById('welcome').textContent =
      'Welcome, ' + session.username;
  }

  // Sign out
  document.getElementById('signOutBtn').onclick = () => {
    logout();
    window.location.href = 'index.html';
  };

  // Go to games page
  document.getElementById('gamesCard').onclick = () => {
    window.location.href = 'games.html';
  };

  // Go to learning page
  document.getElementById('learningCard').onclick = () => {
    window.location.href = 'learning.html';
  };
</script>

</body>
</html>

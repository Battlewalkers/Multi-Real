<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Maze Champion</title>
<style>
body{
    margin:0;
    background:black;
    color:white;
    font-family:Arial;
    display:flex;
}
#leftPanel{
    width:250px;
    padding:15px;
    background:#111;
}
#gameContainer{
    flex:1;
    text-align:center;
}
canvas{
    background:#000;
    display:block;
    margin:0 auto;
}
h3{color:yellow;}
</style>
</head>
<body>

<div id="leftPanel">
<h3>🟡 Maze Champion</h3>
<p><b>GOAL:</b><br>
Collect dots, avoid enemies, reach the purple portal.</p>

<p><b>CONTROLS:</b><br>
W A S D → Move<br>
SPACE → Attack boss</p>

<p><b>POWERUPS:</b><br>
🟢 Green = Speed boost<br>
🔵 Cyan = Shield</p>

<p><b>AVOID:</b><br>
🔴 Red traps<br>
👻 Pink enemies</p>

<p>After portal → Boss Fight!</p>
</div>

<div id="gameContainer">
<h2 id="ui"></h2>
<canvas id="game" width="600" height="600"></canvas>
</div>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

const tileSize=30;
const rows=20;
const cols=20;

let keys={};
document.addEventListener("keydown",e=>keys[e.key]=true);
document.addEventListener("keyup",e=>keys[e.key]=false);

let maze=[],dots=[],traps=[],powerups=[],enemies=[];
let boss=null,projectiles=[];
let score=0,timeLeft=90,health=3;
let gameState="maze";

let player={x:1,y:1,speed:0.15,shield:false,px:1,py:1};

function generateMaze(){
maze=[];
for(let y=0;y<rows;y++){
let row=[];
for(let x=0;x<cols;x++){
if(x==0||y==0||x==cols-1||y==rows-1||Math.random()<0.08){
row.push(1);
}else row.push(0);
}
maze.push(row);
}
maze[1][1]=0;
maze[rows-2][cols-2]=2;
}

function spawnObjects(){
dots=[];traps=[];powerups=[];enemies=[];
for(let y=1;y<rows-1;y++){
for(let x=1;x<cols-1;x++){
if(maze[y][x]==0){
if(Math.random()<0.35)dots.push({x,y});
if(Math.random()<0.04)traps.push({x,y});
if(Math.random()<0.02)powerups.push({x,y,type:Math.random()<0.5?"speed":"shield"});
}
}
}
for(let i=0;i<2;i++){
enemies.push({x:cols-2,y:2+i*5,dir:1});
}
}

function startGame(){
generateMaze();
spawnObjects();
requestAnimationFrame(gameLoop);
setInterval(()=>{if(timeLeft>0)timeLeft--},1000);
}

function gameLoop(){
ctx.clearRect(0,0,600,600);

if(gameState=="maze"){
updateMaze();
drawMaze();
}else if(gameState=="boss"){
updateBoss();
drawBoss();
}

document.getElementById("ui").innerText=
"Score: "+score+" | Health: "+health+" | Time: "+timeLeft;

requestAnimationFrame(gameLoop);
}

function updateMaze(){
movePlayer();
moveEnemies();

dots=dots.filter(d=>{
if(Math.floor(d.x)==Math.floor(player.px)&&Math.floor(d.y)==Math.floor(player.py)){score+=10;return false;}
return true;
});

traps.forEach(t=>{
if(t.x==Math.floor(player.px)&&t.y==Math.floor(player.py)&&!player.shield){
health--;
player.px=1;player.py=1;
}
});

powerups=powerups.filter(p=>{
if(p.x==Math.floor(player.px)&&p.y==Math.floor(player.py)){
if(p.type=="speed")player.speed=0.3;
if(p.type=="shield")player.shield=true;
setTimeout(()=>{player.speed=0.15;player.shield=false},5000);
return false;
}
return true;
});

enemies.forEach(e=>{
if(Math.floor(e.x)==Math.floor(player.px)&&Math.floor(e.y)==Math.floor(player.py)&&!player.shield){
health--;
player.px=1;player.py=1;
}
});

if(maze[Math.floor(player.py)][Math.floor(player.px)]==2){
startBoss();
}

if(health<=0){alert("Game Over");location.reload();}
}

function movePlayer(){
let dx=0,dy=0;
if(keys["w"])dy=-player.speed;
if(keys["s"])dy=player.speed;
if(keys["a"])dx=-player.speed;
if(keys["d"])dx=player.speed;

let nx=player.px+dx;
let ny=player.py+dy;
if(maze[Math.floor(ny)][Math.floor(nx)]!=1){player.px=nx;player.py=ny;}
}

function moveEnemies(){
enemies.forEach(e=>{
if(Math.random()<0.02)e.dir*=-1;
let nx=e.x+0.05*e.dir;
if(maze[Math.floor(e.y)][Math.floor(nx)]==0)e.x=nx;
});
}

function drawMaze(){
for(let y=0;y<rows;y++){
for(let x=0;x<cols;x++){
if(maze[y][x]==1){ctx.fillStyle="blue";ctx.fillRect(x*tileSize,y*tileSize,tileSize,tileSize);}
if(maze[y][x]==2){ctx.fillStyle="purple";ctx.fillRect(x*tileSize,y*tileSize,tileSize,tileSize);}
}
}

dots.forEach(d=>{ctx.fillStyle="yellow";ctx.beginPath();ctx.arc(d.x*tileSize+15,d.y*tileSize+15,4,0,Math.PI*2);ctx.fill();});
traps.forEach(t=>{ctx.fillStyle="red";ctx.fillRect(t.x*tileSize+10,t.y*tileSize+10,10,10);});
powerups.forEach(p=>{ctx.fillStyle=p.type=="speed"?"lime":"cyan";ctx.fillRect(p.x*tileSize+8,p.y*tileSize+8,14,14);});
enemies.forEach(e=>{ctx.fillStyle="pink";ctx.beginPath();ctx.arc(e.x*tileSize+15,e.y*tileSize+15,10,0,Math.PI*2);ctx.fill();});

ctx.fillStyle=player.shield?"cyan":"orange";
ctx.beginPath();
ctx.arc(player.px*tileSize+15,player.py*tileSize+15,12,0,Math.PI*2);ctx.fill();
}

function startBoss(){
gameState="boss";
boss={x:300,y:100,health:40};
projectiles=[];
}

function updateBoss(){
if(Math.random()<0.05){
projectiles.push({x:boss.x,y:boss.y,vx:(Math.random()-0.5)*3,vy:2});
}

projectiles.forEach(p=>{
p.x+=p.vx;
p.y+=p.vy;
if(Math.abs(p.x-player.px*30)<20 && Math.abs(p.y-player.py*30)<20){health--;}
});

if(keys[" "] && boss.health>0){boss.health-=0.2;}

if(boss.health<=0){alert("YOU WIN!");location.reload();}
}

function drawBoss(){
ctx.fillStyle="#200";
ctx.fillRect(0,0,600,600);

ctx.fillStyle="black";
ctx.fillRect(boss.x-40,boss.y-40,80,80);

projectiles.forEach(p=>{ctx.fillStyle="white";ctx.fillRect(p.x,p.y,6,6);});

ctx.fillStyle="orange";
ctx.fillRect(player.px*30,player.py*30,20,20);
}

startGame();
</script>

</body>
</html>
